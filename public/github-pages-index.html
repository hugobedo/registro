    // =========================================================================

    function esc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function clamp(v, max) {
      return typeof v === 'string' ? v.trim().slice(0, max) : '';

    function showToast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 3600);
    }

    function pad2(n) { return String(n).padStart(2, '0'); }

    function nowTime24() {
      const d = new Date();
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function parse24To12(t24) {
      const m = /^(\d{1,2}):(\d{2})$/.exec(String(t24 || '').trim());
      if (!m) return { h: '', m: '', p: 'AM' };
      const h24 = parseInt(m[1], 10);
      const min = parseInt(m[2], 10);
      if (h24 < 0 || h24 > 23 || min < 0 || min > 59) return { h: '', m: '', p: 'AM' };
      return { h: String(h24 % 12 === 0 ? 12 : h24 % 12), m: pad2(min), p: h24 >= 12 ? 'PM' : 'AM' };
    }

    function to24From12(h, m, p) {
      const hi = parseInt(h, 10);
      const mi = parseInt(m, 10);
      if (Number.isNaN(hi) || Number.isNaN(mi) || hi < 1 || hi > 12 || mi < 0 || mi > 59) return '';
      let h24 = hi % 12;
      if (p === 'PM') h24 += 12;
      return `${pad2(h24)}:${pad2(mi)}`;
    }

    function fmt12(t24) {
      const x = parse24To12(t24);
      if (!x.h) return '—';
      return `${x.h}:${x.m} ${x.p === 'PM' ? 'p. m.' : 'a. m.'}`;
    }

    function fmtDateEs(d = new Date()) {
      const s = new Intl.DateTimeFormat('es-MX', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      }).format(d);
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function fmtDateTimeShort(iso) {
      try {
        return new Intl.DateTimeFormat('es-MX', {
          day: '2-digit', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true
        }).format(new Date(iso));
      } catch {
        return iso || '';
      }
    }

    function safeId(prefix, raw) {
      if (raw) {
        const cleaned = String(raw).replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 120);
        if (cleaned) return cleaned;
      }
      const idPart = typeof crypto !== 'undefined' && crypto.randomUUID
        ? crypto.randomUUID().replace(/-/g, '')
        : `${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
      return `${prefix}_${idPart}`.slice(0, 120);
    }

    function getOutcome(p) {
      if (['atendido', 'no_espero_turno', 'no_atendido', 'trasladado'].includes(p.estadoEgreso)) {
        return p.estadoEgreso;
      }
      return (p.horaSalida || '').trim() ? 'atendido' : 'en_atencion';
    }

    function hasExit(p) { return getOutcome(p) !== 'en_atencion'; }

    function outcomeLabel(o) {
      switch (o) {
        case 'atendido': return 'Atendido';
        case 'no_espero_turno': return 'No esperó turno';
        case 'no_atendido': return 'No atendido';
        case 'trasladado': return 'Trasladado a otra unidad';
        default: return 'En atención (sin salida)';
      }
    }

    function outcomeTextColor(o) {
      switch (o) {
        case 'atendido': return 'text-emerald-800';
        case 'no_espero_turno': return 'text-orange-800';
        case 'no_atendido': return 'text-red-800';
        case 'trasladado': return 'text-blue-800';
        default: return 'text-amber-800';
      }
    }

    function treatmentLabel(t) {
      if (t === 'usuario') return 'Usuario';
      if (t === 'usuaria') return 'Usuaria';
      return 'Paciente';
    }

    function computeCounts(list) {
      const c = { total: list.length, enAtencion: 0, atendidos: 0, noEsperoTurno: 0, noAtendidos: 0, trasladados: 0 };
      for (const p of list) {
        const o = getOutcome(p);
        if (o === 'atendido') c.atendidos++;
        else if (o === 'no_espero_turno') c.noEsperoTurno++;
        else if (o === 'no_atendido') c.noAtendidos++;
        else if (o === 'trasladado') c.trasladados++;
        else c.enAtencion++;
      }
      return c;
    }

    // Prefijos automáticos sin duplicar DR./DRA. y ENF.
    function stripDoctorPrefix(raw) {
      let s = String(raw || '').trim();
      const re = /^(?:dr\.?a?\.?|dra\.?|doctor|doctora)\s+/i;
      while (re.test(s)) s = s.replace(re, '').trim();
      return s;
    }

    function detectDoctorTitle(raw) {
      return /^(?:dra\.?|doctora)\b/i.test(String(raw || '').trim()) ? 'DRA.' : 'DR.';
    }

    function formatDoctor(title, rawName) {
      const base = stripDoctorPrefix(rawName);
      if (!base) return '';
      return `${title === 'DRA.' ? 'DRA.' : 'DR.'} ${base}`;
    }

    function stripNursePrefix(raw) {
      let s = String(raw || '').trim();
      const re = /^(?:enf\.?a?\.?|enfermero|enfermera|lic\.?\s*enf\.?)\s+/i;
      while (re.test(s)) s = s.replace(re, '').trim();
      return s;
    }

    function formatNurse(rawName) {
      const base = stripNursePrefix(rawName);
      return base ? `ENF. ${base}` : '';
    }

    // Corrector ortográfico local clínico en español
    const SPELL_MAP = {
      'dolor de cabesa': 'dolor de cabeza', 'cabesa': 'cabeza', 'cefalia': 'cefalea',
      'vomito': 'vómito', 'vomitos': 'vómitos', 'nauseas': 'náuseas', 'nausea': 'náusea',
      'presion': 'presión', 'hipertension': 'hipertensión', 'hipotension': 'hipotensión',
      'hipotencion': 'hipotensión', 'infeccion': 'infección', 'diagnostico': 'diagnóstico',
      'diagnosticos': 'diagnósticos', 'medico': 'médico', 'medica': 'médica',
      'clinica': 'clínica', 'clinico': 'clínico', 'cronico': 'crónico', 'cronica': 'crónica',
      'toracico': 'torácico', 'torax': 'tórax', 'estomago': 'estómago', 'vertigo': 'vértigo',
      'migrana': 'migraña', 'alergico': 'alérgico', 'contusion': 'contusión',
      'laceracion': 'laceración', 'glisemia': 'glucemia', 'glicemia': 'glucemia',
      'diabetico': 'diabético', 'diabetica': 'diabética', 'embaraso': 'embarazo',
      'embarasada': 'embarazada', 'cesarea': 'cesárea', 'valoracion': 'valoración',
      'observacion': 'observación', 'atencion': 'atención', 'revision': 'revisión',
      'curacion': 'curación', 'inyeccion': 'inyección', 'canalizacion': 'canalización',
      'medicacion': 'medicación', 'indicacion': 'indicación', 'indicaciones': 'indicaciones',
      'acompanado': 'acompañado', 'acompanada': 'acompañada', 'acompanante': 'acompañante',
      'espero': 'esperó', 'atendio': 'atendió', 'retiro': 'retiró', 'traslado': 'trasladó',
      'anos': 'años', 'ano': 'año', 'dias': 'días', 'dia': 'día', 'tambien': 'también',
      'despues': 'después', 'sin diagnostico': 'Sin diagnóstico',
      'dolor abnominal': 'dolor abdominal', 'dolor intestnal': 'dolor intestinal'
    };

    function titleCaseEs(str) {
      const small = new Set(['de', 'del', 'la', 'las', 'los', 'y', 'e', 'en', 'el', 'san', 'santa']);
      return str.split(/\s+/).map((w, i) => {
        if (!w) return '';
        if (/^(DR\.|DRA\.|ENF\.)$/i.test(w)) return w.toUpperCase();
        const l = w.toLowerCase();
        return i > 0 && small.has(l) ? l : l.charAt(0).toUpperCase() + l.slice(1);
      }).join(' ');
    }

    function reviewTextField(field, label, raw) {
      const original = String(raw || '');
      if (!original.trim()) return { field, label, original, proposed: original, changed: false, reasons: [] };
      let next = original.replace(/\s+/g, ' ').trim();
      const reasons = [];
      if (next !== original) reasons.push('Espacios normalizados');

      if (field === 'edad') {
        if (/^\d{1,3}$/.test(next)) {
          next = `${next} años`;
          reasons.push('Unidad agregada');
        } else {
          next = next.replace(/\banos\b/gi, 'años');
        }
      } else if (['nombre', 'procedencia', 'medico', 'enfermera'].includes(field)) {
        const titled = titleCaseEs(next);
        if (titled !== next) {
          next = titled;
          reasons.push('Mayúsculas en nombre propio');
        }
      } else {
        let fixed = false;
        for (const wrong of Object.keys(SPELL_MAP).sort((a, b) => b.length - a.length)) {
          const right = SPELL_MAP[wrong];
          const re = new RegExp(`(?<![\\p{L}])${wrong.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(?![\\p{L}])`, 'giu');
          next = next.replace(re, (m) => {
            fixed = true;
            if (m === m.toUpperCase() && m.length > 1) return right.toUpperCase();
            if (m[0] === m[0].toUpperCase()) return right.charAt(0).toUpperCase() + right.slice(1);
            return right;
          });
        }
        if (fixed) reasons.push('Ortografía y acentos');
        const cap = next.charAt(0).toUpperCase() + next.slice(1);
        if (cap !== next) {
          next = cap;
          reasons.push('Mayúscula inicial');
        }
      }
      return { field, label, original, proposed: next, changed: next !== original, reasons };
    }

    // =========================================================================
    // 4. DICTADO POR VOZ (Web Speech API es-MX)
    // =========================================================================
    function voiceSupported() {
      return typeof window !== 'undefined' && ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window);
    }

    function stopVoice() {
      if (recognition) {
        try { recognition.stop(); } catch {}
        recognition = null;
      }
      state.activeVoiceKey = null;
    }

    function toggleVoice(key, onAppend) {
      if (!voiceSupported()) {
        showToast('Tu navegador no admite dictado por voz. Usa Chrome o Edge.');
        return;
      }
      if (state.activeVoiceKey === key) {
        stopVoice();
        render();
        return;
      }
      stopVoice();
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const rec = new SR();
      rec.lang = 'es-MX';
      rec.continuous = false;
      rec.interimResults = false;
      recognition = rec;
      state.activeVoiceKey = key;
      render();

      rec.onresult = (ev) => {
        let text = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          if (ev.results[i].isFinal) text += ev.results[i][0].transcript;
        }
        const clean = text.trim();
        if (clean) {
          onAppend(clean);
          showToast('Dictado agregado al campo.');
          render();
        }
      };
      rec.onerror = (ev) => {
        if (ev.error === 'not-allowed') showToast('Permiso de micrófono denegado.');
        else if (ev.error !== 'no-speech' && ev.error !== 'aborted') showToast('No se pudo capturar el audio.');
      };
      rec.onend = () => {
        if (state.activeVoiceKey === key) {
          state.activeVoiceKey = null;
          recognition = null;
          render();
        }
      };
      try {
        rec.start();
      } catch {
        state.activeVoiceKey = null;
        recognition = null;
        showToast('No se pudo iniciar el micrófono.');
        render();
      }
    }

    // =========================================================================
    // 5. MENSAJES WHATSAPP E INFORME PDF COMPACTO A4
    // =========================================================================
    function buildWhatsAppText(p, type, includeEmpty) {
      const outcome = getOutcome(p);
      const lines = [
        'REGISTRO DE USUARIO',
        type === 'salida' ? 'TIPO DE REGISTRO: SALIDA' : 'TIPO DE REGISTRO: INGRESO',
        '--------------------------------'
      ];
      const add = (label, val) => {
        const clean = String(val || '').trim();
        if (clean) lines.push(`${label}: ${clean}`);
        else if (includeEmpty) lines.push(`${label}: No registrado`);
      };
      add('Hora de entrada', fmt12(p.horaEntrada));
      if (type === 'salida') {
        add('Hora de salida', p.horaSalida ? fmt12(p.horaSalida) : 'No registrada');
        add('Estado de egreso', outcomeLabel(outcome));
      }
      add(treatmentLabel(p.tratamiento), p.nombre);
      add('Edad', p.edad);
      add('Procedencia', p.procedencia);
      add('Motivo de visita', p.motivoVisita);
      if (type === 'ingreso') {
        add('Observaciones', p.observaciones || 'Sin diagnóstico');
      } else {
        add('Médico que lo atendió', p.medico);
        add('Enfermera que lo atendió', p.enfermera);
        add('Diagnóstico', p.diagnostico);
        add('Observaciones de entrada', p.observaciones);
        add('Observaciones de salida', p.observacionesSalida);
      }
      lines.push('--------------------------------');
      lines.push(`Responsable de guardia: ${DEFAULT_SHIFT_SUPERVISOR}`);
      return lines.join('\n');
    }

    function buildShiftSummaryText(list) {
      const c = computeCounts(list);
      return [
        'RESUMEN DE GUARDIA',
        `Fecha: ${fmtDateEs(new Date())}`,
        `Responsable de guardia: ${DEFAULT_SHIFT_SUPERVISOR}`,
        '--------------------------------',
        `Total de pacientes: ${c.total}`,
        `Atendidos: ${c.atendidos}`,
        `No esperó turno: ${c.noEsperoTurno}`,
        `No atendidos: ${c.noAtendidos}`,
        `Trasladados a otra unidad: ${c.trasladados}`,
        `En atención (sin salida): ${c.enAtencion}`
      ].join('\n');
    }

    function generateShiftPdf(list) {
      const jsPDF = window.jspdf?.jsPDF;
      if (!jsPDF) {
        showToast('No se cargó jsPDF. Verifica tu conexión a internet.');
        return;
      }
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 10;
      const w = pageW - margin * 2;
      const counts = computeCounts(list);
      const chrono = [...list].sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
      const exited = chrono.filter((p) => hasExit(p));
      const pending = chrono.filter((p) => !hasExit(p));

      pdf.setFontSize(11.5);

      pdf.setFontSize(8.2);
      pdf.text(`Fecha: ${fmtDateEs(new Date())}   |   Responsable de guardia: ${DEFAULT_SHIFT_SUPERVISOR}`, margin + 3, y + 9.5);
      y += 17;

      pdf.setFillColor(241, 245, 249);
      pdf.setDrawColor(203, 213, 225);
      pdf.rect(margin, y, w, 11, 'FD');
      pdf.setTextColor(15, 23, 42);
      pdf.setFont('helvetica', 'bold');

        margin + 2.5,
        y + 7
      );
      y += 14;

      const ensure = (h) => { if (y + h > pageH - 12) { pdf.addPage(); y = 13; } };
      const sectionBar = (title, rgb) => {
        ensure(8);
        pdf.setFillColor(rgb[0], rgb[1], rgb[2]);
        pdf.rect(margin, y, w, 5.8, 'F');
        pdf.setTextColor(255, 255, 255);
        pdf.setFont('helvetica', 'bold');
        pdf.setFontSize(8);
        pdf.text(title, margin + 2.5, y + 4);
        y += 7.5;
      };

      const drawRow = (p, idx) => {
        const o = getOutcome(p);
        const l1 = `${idx}. [${outcomeLabel(o).toUpperCase()}] ${p.nombre || 'Sin nombre'} (${p.edad || 'Edad N/R'}) — ${p.procedencia || 'Procedencia N/R'}`;
        const l2 = `Entrada: ${fmt12(p.horaEntrada)} | Salida: ${p.horaSalida ? fmt12(p.horaSalida) : 'Sin salida'} | Motivo: ${p.motivoVisita || 'N/R'}`;
        const extras = [];
        if (p.medico) extras.push(`Médico: ${p.medico}`);
        if (p.enfermera) extras.push(`Enfermera: ${p.enfermera}`);
        if (p.diagnostico) extras.push(`Dx: ${p.diagnostico}`);
        if (p.observaciones) extras.push(`Obs. ingreso: ${p.observaciones}`);
        if (p.observacionesSalida) extras.push(`Obs. salida: ${p.observacionesSalida}`);
        const l3 = extras.join(' | ');

        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7.8);
        const s1 = pdf.splitTextToSize(l1, w - 4);
        pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.3);
        const s2 = pdf.splitTextToSize(l2, w - 4);
        const s3 = l3 ? pdf.splitTextToSize(l3, w - 4) : [];
        const boxH = 2.6 + s1.length * 3.3 + s2.length * 3.1 + s3.length * 3.1 + 1.8;

        ensure(boxH + 1.8);
        pdf.setDrawColor(226, 232, 240);
        const fills = {
          atendido: [240, 253, 244],
          no_espero_turno: [255, 247, 237],
          no_atendido: [254, 242, 242],
          trasladado: [239, 246, 255],
          en_atencion: [254, 252, 232]
        };
        const f = fills[o] || [248, 250, 252];
        pdf.setFillColor(f[0], f[1], f[2]);
        pdf.rect(margin, y, w, boxH, 'FD');

        let ty = y + 3.6;
        pdf.setTextColor(15, 23, 42); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7.8);
        pdf.text(s1, margin + 2, ty); ty += s1.length * 3.3;
        pdf.setTextColor(51, 65, 85); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.3);
        pdf.text(s2, margin + 2, ty); ty += s2.length * 3.1;
        if (s3.length) { pdf.setTextColor(30, 41, 59); pdf.text(s3, margin + 2, ty); }
        y += boxH + 1.6;
      };

      if (list.length === 0) {
        pdf.setTextColor(71, 85, 105); pdf.setFontSize(9);
        pdf.text('No hay pacientes registrados en este turno.', margin, y + 5);
      } else {
        if (exited.length) {

      const d = new Date();
      const fname = `Informe_Guardia_${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.pdf`;
      pdf.save(fname);

    }

      const path = `users/${user.uid}`;

        const snap = await getDoc(ref);
        if (snap.exists()) {

            await updateDoc(ref, { displayName, updatedAt: serverTimestamp() });

          return {
            uid: user.uid,
            email: String(data.email || user.email || ''),
            displayName: displayName || String(data.email || ''),
            role: data.role === 'admin' || boot ? 'admin' : 'staff',
            approved: Boolean(data.approved) || boot

          uid: user.uid,

          role: boot ? 'admin' : 'staff',

    async function importBatchToCloud(rawRecords, actionType) {
      const u = state.user;
      const existingIds = new Set(state.patients.map((p) => p.id));
      let imported = 0;
      let skipped = 0;
      const toInsert = [];
      for (const item of rawRecords) {
        if (!item || typeof item !== 'object') continue;
        const id = safeId('pac', item.id);
        if (existingIds.has(id)) { skipped++; continue; }
        existingIds.add(id);
        const nowIso = new Date().toISOString();
        const hs = clamp(item.horaSalida || '', 10);
        const st = ['atendido', 'no_espero_turno', 'no_atendido', 'trasladado'].includes(item.estadoEgreso)
          ? item.estadoEgreso : (hs ? 'atendido' : 'en_atencion');
        toInsert.push({
          id,
          payload: {
            id,
            workspaceId: WORKSPACE_ID,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
            createdAtIso: clamp(item.createdAt || nowIso, 40) || nowIso,
            updatedAtIso: nowIso,
            createdByUid: u.uid,
            createdByEmail: clamp(u.email || '', 200),
            updatedByUid: u.uid,
            updatedByEmail: clamp(u.email || '', 200),
            version: 1,
            horaEntrada: clamp(item.horaEntrada || '', 10),
            horaSalida: hs,
            estadoEgreso: st,
            tratamiento: ['paciente', 'usuario', 'usuaria'].includes(item.tratamiento) ? item.tratamiento : 'paciente',
            nombre: clamp(item.nombre || '', 200),
            edad: clamp(item.edad || '', 60),
            procedencia: clamp(item.procedencia || '', 200),
            motivoVisita: clamp(item.motivoVisita || '', 1000),
            observaciones: clamp(item.observaciones || '', 1500),
            observacionesSalida: clamp(item.observacionesSalida || '', 1500),
            medico: clamp(item.medico || '', 200),
            enfermera: clamp(item.enfermera || '', 200),
            diagnostico: clamp(item.diagnostico || '', 1500)
          }
        });
      }
      try {
        for (let i = 0; i < toInsert.length; i += 400) {
          const batch = writeBatch(db);
          for (const row of toInsert.slice(i, i + 400)) {
            batch.set(doc(db, 'patients', row.id), row.payload);
            imported++;
          }
          await batch.commit();
        }
        if (imported > 0) {
          await writeAuditLog(
            actionType,
            actionType === 'migrate_local'
              ? `Migró ${imported} registros locales a la nube`
              : `Restauró ${imported} registros desde respaldo JSON`,
            imported,
            ''
          );
        }
        return { imported, skipped };
      } catch (err) {
        handleFirestoreError(err, OperationType.WRITE, 'patients');
      }
    }

    function formatFirestoreQueryError(err, fallback) {
      if (err && typeof err === 'object') {
        const code = typeof err.code === 'string' ? err.code.trim() : '';
        const msg = typeof err.message === 'string' ? err.message.trim() : '';
        if (code && msg) return msg.includes(code) ? msg : `[${code}] ${msg}`;
        if (msg) return msg;
        if (code) return `[${code}] ${fallback}`;
      }
      if (typeof err === 'string' && err.trim()) return err.trim();
      return fallback;
    }

    function extractAccessRequestIso(d) {
      for (const candidate of [d.requestedAt, d.requestedAtIso]) {
        if (typeof candidate === 'string' && candidate.trim()) return candidate.trim();
        if (typeof candidate === 'number' && Number.isFinite(candidate)) {
          const dt = new Date(candidate);
          if (!Number.isNaN(dt.getTime())) return dt.toISOString();
        }
        if (candidate && typeof candidate === 'object' && typeof candidate.toDate === 'function') {
          const dt = candidate.toDate();
          if (!Number.isNaN(dt.getTime())) return dt.toISOString();
        }
        if (candidate && typeof candidate === 'object') {
          const rawSeconds = typeof candidate.seconds === 'number'
            ? candidate.seconds
            : (typeof candidate._seconds === 'number' ? candidate._seconds : null);
          if (rawSeconds !== null) {
            const dt = new Date(rawSeconds * 1000);
            if (!Number.isNaN(dt.getTime())) return dt.toISOString();
          }
        }
      }
      return '';
    }

    function parseAccessRequestStatus(raw) {
      if (raw === 'pendiente' || raw === 'aprobada' || raw === 'rechazada') return raw;
      return null;
    }

    function mapAccessRequestDoc(docId, d) {
      const status = parseAccessRequestStatus(d.status);
      if (!status) return null;
      const assignedRole = d.assignedRole === 'admin' || d.assignedRole === 'staff' ? d.assignedRole : '';
      const uid = typeof d.uid === 'string' && d.uid.trim() ? d.uid.trim() : docId;
      return {
        uid,
        email: typeof d.email === 'string' ? d.email : '',
        displayName: typeof d.displayName === 'string' ? d.displayName : '',
        status,
        requestedAtIso: extractAccessRequestIso(d),
        reviewedByUid: String(d.reviewedByUid || ''),
        reviewedByEmail: String(d.reviewedByEmail || ''),
        reviewedAtIso: String(d.reviewedAtIso || ''),
        assignedRole
      };
    }

    let accessSyncEpoch = 0;

    async function fetchPendingAccessRequestsFromServer() {
      const q = query(collection(db, 'access_requests'), where('status', '==', 'pendiente'));
      try {
        const snap = await getDocsFromServer(q);
        return snap.docs
          .map((d) => mapAccessRequestDoc(d.id, d.data()))
          .filter((item) => item !== null && item.status === 'pendiente')
          .sort((a, b) => b.requestedAtIso.localeCompare(a.requestedAtIso));
      } catch (err) {
        const readable = formatFirestoreQueryError(err, 'Error al consultar las solicitudes de acceso en Firestore.');
        try { handleFirestoreError(err, OperationType.LIST, 'access_requests'); } catch {}
        throw new Error(readable);
      }
    }

    async function refreshAccessRequestsFromServer() {
      if (!isPrimaryAdmin()) return;
      const epoch = ++accessSyncEpoch;
      state.accessRequestsLoading = true;
      state.accessRequestsError = '';
      render();
      try {
        const list = await fetchPendingAccessRequestsFromServer();
        if (epoch !== accessSyncEpoch) return;
        state.accessRequests = list;
        state.accessRequestsError = '';
      } catch (err) {
        if (epoch !== accessSyncEpoch) return;
        state.accessRequestsError = err instanceof Error ? err.message : 'Error al consultar las solicitudes de acceso en Firestore.';
      } finally {
        if (epoch === accessSyncEpoch) {
          state.accessRequestsLoading = false;
          render();
        }
      }
    }

    async function submitAccessRequestCloud() {
      const user = state.user;
      if (!user || !user.email || !user.emailVerified) {
        throw new Error('Se requiere una cuenta de Google verificada para solicitar acceso.');
      }
      const path = `access_requests/${user.uid}`;
      const ref = doc(db, 'access_requests', user.uid);
      const nowIso = new Date().toISOString();
      const displayName = clamp(user.displayName || user.email || 'Usuario', 150);
      try {
        const snap = await getDoc(ref);
        if (snap.exists()) {
          if (parseAccessRequestStatus(snap.data().status) === 'pendiente') {
            throw new Error('Ya tienes una solicitud de acceso pendiente de revisión.');
          }
          await updateDoc(ref, {
            displayName,
            status: 'pendiente',
            requestedAt: serverTimestamp(),
            requestedAtIso: nowIso,
            updatedAt: serverTimestamp(),
            reviewedByUid: '',
            reviewedByEmail: '',
            reviewedAtIso: '',
            assignedRole: ''
          });
          return;
        }
        await setDoc(ref, {
          uid: user.uid,
          email: clamp(user.email, 200),
          displayName,
          status: 'pendiente',
          requestedAt: serverTimestamp(),
          requestedAtIso: nowIso,
          updatedAt: serverTimestamp(),
          reviewedByUid: '',
          reviewedByEmail: '',
          reviewedAtIso: '',
          assignedRole: ''
        });
      } catch (err) {
        if (err instanceof Error && err.message.includes('solicitud de acceso pendiente')) throw err;
        handleFirestoreError(err, OperationType.WRITE, path);
      }
    }

    async function approveAccessRequestCloud(req, role) {
      if (!isPrimaryAdmin() || !state.user) throw new Error('Solo el administrador principal puede aprobar solicitudes.');
      const path = `access_requests/${req.uid}`;
      const nowIso = new Date().toISOString();
      const safeName = clamp(req.displayName || req.email || 'Personal clínico', 150);
      const safeEmail = clamp(req.email, 200);
      const roleLabel = role === 'admin' ? 'Administrador' : 'Personal';
      try {
        const userRef = doc(db, 'users', req.uid);
        const reqRef = doc(db, 'access_requests', req.uid);
        const logId = safeId('log');
        const logRef = doc(db, 'audit_logs', logId);
        const userSnap = await getDoc(userRef);
        const batch = writeBatch(db);
        if (userSnap.exists()) {
          batch.update(userRef, { role, approved: true, displayName: safeName, updatedAt: serverTimestamp() });
        } else {
          batch.set(userRef, {
            uid: req.uid,
            email: safeEmail,
            displayName: safeName,
            role,
            approved: true,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
        }
        batch.update(reqRef, {
          status: 'aprobada',
          assignedRole: role,
          reviewedByUid: state.user.uid,
          reviewedByEmail: clamp(state.user.email || '', 200),
          reviewedAtIso: nowIso,
          updatedAt: serverTimestamp()
        });
        batch.set(logRef, {
          id: logId,
          workspaceId: WORKSPACE_ID,
          action: 'approve_access_request',
          actorUid: state.user.uid,
          actorEmail: clamp(state.user.email || '', 200),
          actorName: clamp(state.user.displayName || state.user.email || 'Administrador', 150),
          summary: clamp(`Aprobó la solicitud de acceso de ${safeEmail} con rol ${roleLabel}`, 500),
          affectedCount: 1,
          patientId: '',
          createdAt: serverTimestamp(),
          createdAtIso: nowIso
        });
        await batch.commit();
      } catch (err) {
        handleFirestoreError(err, OperationType.WRITE, path);
      }
    }

    async function rejectAccessRequestCloud(req) {
      if (!isPrimaryAdmin() || !state.user) throw new Error('Solo el administrador principal puede rechazar solicitudes.');
      const path = `access_requests/${req.uid}`;
      const nowIso = new Date().toISOString();
      const safeEmail = clamp(req.email, 200);
      try {
        const reqRef = doc(db, 'access_requests', req.uid);
        const logId = safeId('log');
        const logRef = doc(db, 'audit_logs', logId);
        const batch = writeBatch(db);
        batch.update(reqRef, {
          status: 'rechazada',
          assignedRole: '',
          reviewedByUid: state.user.uid,
          reviewedByEmail: clamp(state.user.email || '', 200),
          reviewedAtIso: nowIso,
          updatedAt: serverTimestamp()
        });
        batch.set(logRef, {
          id: logId,
          workspaceId: WORKSPACE_ID,
          action: 'reject_access_request',
          actorUid: state.user.uid,
          actorEmail: clamp(state.user.email || '', 200),
          actorName: clamp(state.user.displayName || state.user.email || 'Administrador', 150),
          summary: clamp(`Rechazó la solicitud de acceso de ${safeEmail}`, 500),
          affectedCount: 1,
          patientId: '',
          createdAt: serverTimestamp(),
          createdAtIso: nowIso
        });
        await batch.commit();
      } catch (err) {
        handleFirestoreError(err, OperationType.WRITE, path);
      }
    }

    // =========================================================================
    // 7. SUSCRIPCIONES EN TIEMPO REAL Y CICLO DE AUTENTICACIÓN
    // =========================================================================
    function clearSubscriptions() {
      for (const fn of state.unsubs) { try { fn(); } catch {} }
      state.unsubs = [];
    }

    function startDataSubscriptions() {
      clearSubscriptions();
      if (!state.user || !isAuthorized()) return;

      const uPatients = onSnapshot(
        query(collection(db, 'patients'), where('workspaceId', '==', WORKSPACE_ID)),
        { includeMetadataChanges: true },
        (snap) => {
          state.patients = snap.docs
            .map((d) => mapPatientDoc(d.id, d.data()))
            .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
          state.fromCache = snap.metadata.fromCache;
          state.patientsLoaded = true;
          void maybeMigrateLegacyLocal();
          render();
        },
        (err) => {
          state.runtimeError = 'Error al sincronizar pacientes con Firestore.';
          render();
          handleFirestoreError(err, OperationType.LIST, 'patients');
        }
      );

      const uConfig = onSnapshot(
        doc(db, 'shift_config', 'current'),
        (snap) => {
          if (snap.exists()) {
            const d = snap.data();
            state.shiftConfig = {
              workspaceId: WORKSPACE_ID,
              responsableGuardia: DEFAULT_SHIFT_SUPERVISOR,
              whatsappGroupUrl: typeof d.whatsappGroupUrl === 'string' && d.whatsappGroupUrl ? d.whatsappGroupUrl : DEFAULT_WHATSAPP_GROUP_URL,
              incluirCamposVaciosEnMensaje: Boolean(d.incluirCamposVaciosEnMensaje)
            };
            render();
          }
        },
        (err) => handleFirestoreError(err, OperationType.GET, 'shift_config/current')
      );

      const uLogs = onSnapshot(
        query(collection(db, 'audit_logs'), where('workspaceId', '==', WORKSPACE_ID)),
        (snap) => {
          state.auditLogs = snap.docs
            .map((d) => d.data())
            .sort((a, b) => String(b.createdAtIso || '').localeCompare(String(a.createdAtIso || '')))
            .slice(0, 80);
          render();
        },
        (err) => handleFirestoreError(err, OperationType.LIST, 'audit_logs')
      );

      state.unsubs.push(uPatients, uConfig, uLogs);

      if (isPrimaryAdmin()) {
        const epoch = ++accessSyncEpoch;
        state.staffUsersError = '';
        state.accessRequestsError = '';
        state.accessRequestsLoading = true;
        const uStaff = onSnapshot(
          query(collection(db, 'users'), where('approved', '==', true)),
          (snap) => {
            state.staffUsersError = '';
            state.staffUsers = snap.docs
              .map((d) => {
                const x = d.data();
                return {
                  uid: typeof x.uid === 'string' && x.uid.trim() ? x.uid.trim() : d.id,
                  email: String(x.email || ''),
                  displayName: String(x.displayName || ''),
                  role: x.role === 'admin' ? 'admin' : 'staff',
                  approved: Boolean(x.approved)
                };
              })
              .sort((a, b) => (a.role !== b.role ? (a.role === 'admin' ? -1 : 1) : a.email.localeCompare(b.email)));
            render();
          },
          (err) => {
            state.staffUsersError = formatFirestoreQueryError(err, 'Error al consultar el personal autorizado.');
            render();
            try { handleFirestoreError(err, OperationType.LIST, 'users'); } catch {}
          }
        );
        const uRequests = onSnapshot(
          query(collection(db, 'access_requests'), where('status', '==', 'pendiente')),
          (snap) => {
            const list = snap.docs
              .map((d) => mapAccessRequestDoc(d.id, d.data()))
              .filter((item) => item !== null && item.status === 'pendiente')
              .sort((a, b) => b.requestedAtIso.localeCompare(a.requestedAtIso));
            state.accessRequestsError = '';
            state.accessRequests = list;
            if (!snap.metadata.fromCache || list.length > 0) {
              state.accessRequestsLoading = false;
            }
            render();
          },
          (err) => {
            state.accessRequestsError = formatFirestoreQueryError(err, 'Error al consultar las solicitudes de acceso en Firestore.');
            state.accessRequestsLoading = false;
            render();
            try { handleFirestoreError(err, OperationType.LIST, 'access_requests'); } catch {}
          }
        );
        state.unsubs.push(uStaff, uRequests);
        fetchPendingAccessRequestsFromServer()
          .then((list) => {
            if (epoch !== accessSyncEpoch) return;
            state.accessRequests = list;
            state.accessRequestsError = '';
            state.accessRequestsLoading = false;
            render();
          })
          .catch((err) => {
            if (epoch !== accessSyncEpoch) return;
            state.accessRequestsError = err instanceof Error ? err.message : 'Error al consultar las solicitudes de acceso en Firestore.';
            state.accessRequestsLoading = false;
            render();
          });
      } else {
        accessSyncEpoch++;
        state.accessRequests = [];
        state.accessRequestsLoading = false;
        state.accessRequestsError = '';
      }
    }

    async function maybeMigrateLegacyLocal() {
      if (state.migrationAttempted || !state.patientsLoaded || !isAuthorized()) return;
      state.migrationAttempted = true;
      try {
        if (localStorage.getItem(MIGRATION_DONE_KEY) === '1') return;
        const raw = localStorage.getItem(LEGACY_LOCAL_KEY);
        if (!raw) { localStorage.setItem(MIGRATION_DONE_KEY, '1'); return; }
        const parsed = JSON.parse(raw);
        const list = Array.isArray(parsed?.patients) ? parsed.patients : [];
        if (list.length > 0) {
          const { imported } = await importBatchToCloud(list, 'migrate_local');
          if (imported > 0) showToast(`Se migraron ${imported} registros previos a la base compartida.`);
        }
        localStorage.setItem(MIGRATION_DONE_KEY, '1');
      } catch {
        // Conserva datos locales sin interrumpir
      }
    }

    onAuthStateChanged(auth, async (user) => {
      clearSubscriptions();
      state.user = user;
      state.authReady = true;
      state.authError = '';
      if (!user) {
        state.profile = null;
        state.patients = [];
        state.patientsLoaded = false;
        state.auditLogs = [];
        accessSyncEpoch++;
        state.staffUsers = [];
        state.staffUsersError = '';
        state.accessRequests = [];
        state.accessRequestsLoading = false;
        state.accessRequestsError = '';
        state.ownAccessRequest = null;
        state.requestFeedback = null;
        state.migrationAttempted = false;
        render();
        return;
      }

      state.profileLoading = true;
      render();
      try {
        state.profile = await ensureUserProfile(user);
        state.profileLoading = false;
        let unsubOwnReq = null;
        const syncOwnReqListener = () => {
          if (isAuthorized()) {
            if (unsubOwnReq) { try { unsubOwnReq(); } catch {} unsubOwnReq = null; }
            state.ownAccessRequest = null;
          } else if (!unsubOwnReq) {
            unsubOwnReq = onSnapshot(doc(db, 'access_requests', user.uid), (snap) => {
              state.ownAccessRequest = snap.exists() ? mapAccessRequestDoc(snap.id, snap.data()) : null;
              render();
            });
            state.unsubs.push(() => { if (unsubOwnReq) { try { unsubOwnReq(); } catch {} unsubOwnReq = null; } });
          }
        };
        const unsubOwn = onSnapshot(doc(db, 'users', user.uid), (snap) => {
          if (snap.exists()) {
            const d = snap.data();
            const wasAuth = isAuthorized();
            state.profile = {
              uid: user.uid,
              email: String(d.email || user.email || ''),
              displayName: String(d.displayName || ''),
              role: d.role === 'admin' ? 'admin' : 'staff',
              approved: Boolean(d.approved)
            };
            if (!wasAuth && isAuthorized()) {
              startDataSubscriptions();
            } else if (wasAuth && !isAuthorized()) {
              clearSubscriptions();
              state.patients = [];
              state.patientsLoaded = false;
              state.auditLogs = [];
              accessSyncEpoch++;
              state.staffUsers = [];
              state.staffUsersError = '';
              state.accessRequests = [];
              state.accessRequestsLoading = false;
              state.accessRequestsError = '';
              state.unsubs.push(unsubOwn);
            }
            syncOwnReqListener();
            render();
          }
        });
        state.unsubs.push(unsubOwn);
        if (isAuthorized()) startDataSubscriptions();
        syncOwnReqListener();
      } catch {
        state.profileLoading = false;
        state.authError = 'No se pudo inicializar tu perfil en Firestore. Intenta recargar.';
      }
      render();
    });

    function renderPatientsView() {
      const q = state.searchQuery.trim().toLowerCase();
      const filtered = state.patients.filter((p) => {
        const outcome = getOutcome(p);
        if (state.statusFilter !== 'todos' && outcome !== state.statusFilter) return false;
        if (!q) return true;
        const haystack = [p.nombre, p.procedencia, p.motivoVisita, p.diagnostico, p.medico, p.enfermera].join(' ').toLowerCase();
        return haystack.includes(q);
      });

      const filters = [
        { id: 'todos', label: 'Todos' },
        { id: 'en_atencion', label: 'Activos' },
        { id: 'atendido', label: 'Atendidos' },
        { id: 'no_espero_turno', label: 'No esperó' },
        { id: 'no_atendido', label: 'No atendidos' },
        { id: 'trasladado', label: 'Trasladados' }

      return `
        <section aria-label="Listado de pacientes" class="rounded-2xl border border-slate-200 bg-white p-4 sm:p-6">
          <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
            <div class="relative flex-1 max-w-xl">
              <label for="patient-search" class="sr-only">Buscar paciente por nombre y apellidos</label>
              <input id="patient-search" type="search" value="${esc(state.searchQuery)}" placeholder="Buscar paciente por nombre, apellidos, motivo o procedencia..."

              ${state.searchQuery ? `<button type="button" data-action="clear-search" class="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg border border-slate-300 bg-white px-2.5 py-1 text-xs font-semibold text-slate-700 hover:bg-slate-100">Limpiar</button>` : ''}

            <div class="flex flex-wrap items-center gap-1 rounded-xl bg-slate-100 p-1" role="tablist" aria-label="Filtrar por estado">
              ${filters.map((f) => `
                <button type="button" data-action="filter-status" data-status="${f.id}"
                  class="min-h-[36px] rounded-lg px-3 py-1.5 text-xs font-semibold transition-colors whitespace-nowrap shrink-0 ${
                    state.statusFilter === f.id ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'

          <div class="mt-3 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-600 border-b border-slate-200 pb-3">

            ${(state.searchQuery || state.statusFilter !== 'todos') ? `<button type="button" data-action="reset-filters" class="font-semibold text-teal-800 hover:underline">Ver todos los registros</button>` : ''}
          </div>

          ${!state.patientsLoaded ? `
            <div class="py-12 text-center text-sm text-slate-500">Cargando pacientes desde la base de datos compartida...</div>
          ` : filtered.length === 0 ? `
            <div class="py-12 text-center">

              <p class="mt-1 text-sm text-slate-600">${state.patients.length === 0 ? 'Selecciona Formato de entrada para capturar el primer ingreso.' : 'Intenta con otro nombre o limpia el filtro activo.'}</p>
              <div class="mt-4 flex justify-center gap-2">
                ${state.patients.length === 0
                  ? `<button type="button" data-action="go-entrada" class="min-h-[44px] rounded-xl bg-teal-700 px-5 py-2.5 text-sm font-bold text-white hover:bg-teal-800">Abrir Formato de entrada</button>`
                  : `<button type="button" data-action="reset-filters" class="min-h-[44px] rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-800 hover:bg-slate-50">Limpiar filtros</button>`}
              </div>
            </div>
          ` : `
            <div class="divide-y divide-slate-200">
              ${filtered.map((p) => {
                const outcome = getOutcome(p);
                const exited = hasExit(p);
                const confirmingDel = state.deleteConfirmPatientId === p.id;
                return `
                  <article class="py-4 first:pt-4 last:pb-1">
                    <div class="flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
                      <div class="min-w-0 flex-1">

                        <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5 text-xs text-slate-600">
                          <span>${esc(treatmentLabel(p.tratamiento))}</span>
                          ${p.edad ? `<span aria-hidden="true">·</span><span>${esc(p.edad)}</span>` : ''}
                          ${p.procedencia ? `<span aria-hidden="true">·</span><span>${esc(p.procedencia)}</span>` : ''}
                          <span aria-hidden="true">·</span>
                          <span class="font-mono-num text-slate-800">Entrada: ${esc(fmt12(p.horaEntrada))}</span>
                          <span aria-hidden="true">·</span>
                          <span class="font-mono-num text-slate-800">Salida: ${p.horaSalida ? esc(fmt12(p.horaSalida)) : 'Pendiente'}</span>
                        </div>

                        <dl class="mt-2.5 grid grid-cols-1 gap-1.5 text-sm text-slate-700 sm:grid-cols-2">
                          <div><dt class="inline font-semibold text-slate-900">Motivo:</dt> <dd class="inline">${esc(p.motivoVisita || 'No registrado')}</dd></div>
                          ${p.observaciones ? `<div><dt class="inline font-semibold text-slate-900">Obs. ingreso:</dt> <dd class="inline">${esc(p.observaciones)}</dd></div>` : ''}
                          ${p.medico ? `<div><dt class="inline font-semibold text-slate-900">Médico:</dt> <dd class="inline">${esc(p.medico)}</dd></div>` : ''}
                          ${p.enfermera ? `<div><dt class="inline font-semibold text-slate-900">Enfermera:</dt> <dd class="inline">${esc(p.enfermera)}</dd></div>` : ''}
                          ${p.diagnostico ? `<div class="sm:col-span-2"><dt class="inline font-semibold text-slate-900">Diagnóstico:</dt> <dd class="inline">${esc(p.diagnostico)}</dd></div>` : ''}
                          ${p.observacionesSalida ? `<div class="sm:col-span-2"><dt class="inline font-semibold text-slate-900">Obs. salida:</dt> <dd class="inline">${esc(p.observacionesSalida)}</dd></div>` : ''}
                        </dl>

                      <div class="flex flex-wrap items-center gap-2 shrink-0">

                              : 'bg-teal-700 text-white hover:bg-teal-800'
                          }">
                          ${exited ? 'Editar salida' : 'Registrar salida'}
                        </button>
                        <button type="button" data-action="open-whatsapp" data-id="${esc(p.id)}" data-type="ingreso"
                          class="min-h-[40px] rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-800 hover:bg-slate-50 whitespace-nowrap shrink-0">
                          WA Entrada
                        </button>
                        ${exited ? `
                          <button type="button" data-action="open-whatsapp" data-id="${esc(p.id)}" data-type="salida"
                            class="min-h-[40px] rounded-xl border border-emerald-300 bg-emerald-50 px-3 py-2 text-xs font-semibold text-emerald-900 hover:bg-emerald-100 whitespace-nowrap shrink-0">
                            WA Salida
                          </button>` : ''}
                        <button type="button" data-action="edit-patient" data-id="${esc(p.id)}"
                          class="min-h-[40px] rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 whitespace-nowrap shrink-0">
                          Editar
                        </button>
                        ${confirmingDel ? `
                          <button type="button" data-action="confirm-delete-one" data-id="${esc(p.id)}" class="min-h-[40px] rounded-xl bg-red-600 px-3 py-2 text-xs font-bold text-white hover:bg-red-700 whitespace-nowrap shrink-0">Confirmar borrado</button>
                          <button type="button" data-action="cancel-delete-one" class="min-h-[40px] rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-700 whitespace-nowrap shrink-0">Cancelar</button>
                        ` : `
                          <button type="button" data-action="ask-delete-one" data-id="${esc(p.id)}" class="min-h-[40px] rounded-xl border border-red-200 bg-white px-3 py-2 text-xs font-semibold text-red-700 hover:bg-red-50 whitespace-nowrap shrink-0">Eliminar</button>
                        `}
                      </div>
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
          `}
        </section>`;
    }

                  ${state.accessRequestsError ? `
                    <div role="alert" class="rounded-xl border border-red-200 bg-red-50 px-3.5 py-3 text-xs text-red-800">
                      <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
                        <div class="min-w-0">
                          <div class="font-bold">Error al consultar las solicitudes de acceso</div>
                          <div class="mt-1 font-mono-num break-words">${esc(state.accessRequestsError)}</div>
                        </div>
                        <button type="button" data-action="refresh-access-requests" ${state.accessRequestsLoading ? 'disabled' : ''}
                          class="min-h-[34px] shrink-0 rounded-lg border border-red-300 bg-white px-3 py-1 text-xs font-semibold text-red-800 hover:bg-red-100 disabled:opacity-60">
                          Reintentar
                        </button>
                      </div>
                    </div>` : state.accessRequestsLoading && pendingReqs.length === 0 ? `<p role="status" class="py-3 text-sm text-slate-500">Cargando solicitudes de acceso pendientes...</p>` : pendingReqs.length === 0 ? `<p class="py-2 text-sm text-slate-500">No hay solicitudes de acceso pendientes.</p>` : `<div class="divide-y divide-slate-200">${pendingReqs.map((r) => {
                    const roleVal = state.requestRoleDrafts[r.uid] || 'staff';
                    const busy = state.accessBusyKey === r.uid;
                    return `
                      <div class="flex flex-col gap-3 py-3.5 lg:flex-row lg:items-center lg:justify-between">
                        <div class="min-w-0">
                          <div class="text-sm font-bold text-slate-900 truncate">${esc(r.displayName || r.email)}</div>
                          <div class="text-xs font-mono-num text-slate-600 truncate">${esc(r.email)}</div>
                          <div class="mt-0.5 text-xs text-slate-500">Solicitado: <span class="font-mono-num">${esc(fmtDateTimeShort(r.requestedAtIso))}</span> <span class="mx-1 text-slate-300">·</span> <span class="font-mono-num text-[11px] text-slate-400">UID: ${esc(r.uid)}</span></div>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 shrink-0">
                          <select data-action="select-request-role" data-uid="${esc(r.uid)}" ${busy ? 'disabled' : ''} aria-label="Rol para ${esc(r.email)}"
                            class="min-h-[38px] rounded-lg border border-slate-300 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-800">
                            <option value="staff" ${roleVal === 'staff' ? 'selected' : ''}>Personal</option>
                            <option value="admin" ${roleVal === 'admin' ? 'selected' : ''}>Administrador</option>
                          </select>
                          <button type="button" data-action="approve-access-request" data-uid="${esc(r.uid)}" ${busy ? 'disabled' : ''}
                            class="min-h-[38px] rounded-lg bg-emerald-700 px-3 py-1.5 text-xs font-bold text-white hover:bg-emerald-800 disabled:opacity-60">
                            Aprobar
                          </button>
                          <button type="button" data-action="reject-access-request" data-uid="${esc(r.uid)}" ${busy ? 'disabled' : ''}
                            class="min-h-[38px] rounded-lg border border-red-300 bg-red-50 px-3 py-1.5 text-xs font-bold text-red-800 hover:bg-red-100 disabled:opacity-60">
                            Rechazar
                          </button>
                        </div>
                      </div>`;
                  }).join('')}</div>`}
                </div>` : `
                <div class="mt-4 divide-y divide-slate-200">
                  ${state.staffUsersError ? `
                    <div role="alert" class="rounded-xl border border-red-200 bg-red-50 px-3.5 py-3 text-xs text-red-800">
                      <div class="font-bold">Error al consultar el personal autorizado</div>
                      <div class="mt-1 font-mono-num break-words">${esc(state.staffUsersError)}</div>
                    </div>` : authorizedList.length === 0 ? `<p class="py-4 text-sm text-slate-500">Solo tu cuenta administradora está registrada por ahora.</p>` : authorizedList.map((u) => {
                    const isSelf = u.uid === state.user.uid || u.email.toLowerCase() === ADMIN_EMAIL;
                    const busy = state.accessBusyKey === u.uid;
                    return `
                      <div class="flex flex-col gap-2 py-3 sm:flex-row sm:items-center sm:justify-between">
                        <div>
                          <div class="text-sm font-bold text-slate-900">${esc(u.displayName || u.email)}</div>
                          <div class="text-xs text-slate-600">${esc(u.email)} · ${u.role === 'admin' ? 'Administrador' : 'Personal'}</div>
                        </div>
                        ${isSelf ? `<span class="text-xs font-semibold text-teal-800">Cuenta principal activa</span>` : `
                          <div class="flex flex-wrap items-center gap-2">
                            <select data-action="change-staff-role" data-uid="${esc(u.uid)}" ${busy ? 'disabled' : ''} aria-label="Rol de ${esc(u.email)}"
                              class="min-h-[38px] rounded-lg border border-slate-300 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-800">
                              <option value="staff" ${u.role === 'staff' ? 'selected' : ''}>Personal</option>
                              <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Administrador</option>
                            </select>
                            <button type="button" data-action="revoke-staff-access" data-uid="${esc(u.uid)}" ${busy ? 'disabled' : ''}
                              class="min-h-[38px] rounded-lg border border-red-300 bg-red-50 px-3 py-1.5 text-xs font-bold text-red-800 hover:bg-red-100 disabled:opacity-60">
                              Revocar acceso
                            </button>
                          </div>`}
                      </div>`;
                  }).join('')}
                </div>`}
            </section>`;
          })() : ''}

          <section class="rounded-2xl border border-slate-200 bg-white p-4 sm:p-6">
            <h2 class="text-lg font-bold text-slate-900">Bitácora inmutable de auditoría</h2>
            <p class="mt-1 text-sm text-slate-600">Historial automático de registros, salidas, respaldos y acciones administrativas.</p>
            <div class="mt-4 divide-y divide-slate-200 max-h-96 overflow-y-auto">
              ${state.auditLogs.length === 0 ? `<p class="py-4 text-sm text-slate-500">Sin eventos registrados todavía.</p>` : state.auditLogs.map((log) => `
                <div class="py-2.5 text-xs">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <span class="font-semibold text-slate-900">${esc(log.summary)}</span>
                    <span class="font-mono-num text-slate-500">${esc(fmtDateTimeShort(log.createdAtIso))}</span>
                  </div>
                  <div class="mt-0.5 text-slate-600">${esc(log.actorName || log.actorEmail)} · ${esc(log.actorEmail)}</div>
                </div>
              `).join('')}
            </div>
          </section>
        </div>`;
    }

    function renderModals() {
      let html = '';

      // Modal 1: Salida / Egreso
      if (state.dischargeModal) {
        const dm = state.dischargeModal;
        const patient = state.patients.find((p) => p.id === dm.patientId);
        if (patient) {
          html += `
            <div class="fixed inset-0 z-40 flex items-center justify-center bg-slate-950/60 p-3 sm:p-5 overflow-y-auto">
              <div role="dialog" aria-modal="true" aria-label="Registrar salida" class="w-full max-w-2xl rounded-2xl border border-slate-200 bg-white p-5 sm:p-6 my-auto max-h-[92vh] overflow-y-auto">
                <div class="flex items-start justify-between gap-3 border-b border-slate-200 pb-3">
                  <div>
                    <h2 class="text-lg font-bold text-slate-900">Registrar salida de paciente</h2>
                    <p class="text-xs text-slate-600">${esc(patient.nombre)} · Entrada: ${esc(fmt12(patient.horaEntrada))}</p>
                  </div>
                  <button type="button" data-action="close-discharge" class="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50">Cerrar</button>
                </div>

                ${dm.error ? `<div role="alert" class="mt-3 rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-semibold text-red-800">${esc(dm.error)}</div>` : ''}

                <div class="mt-4 space-y-4">
                  <div class="flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <label class="block text-xs font-bold text-slate-800 mb-1.5">Hora de salida (formato 12 h)</label>
                      ${renderTime12hControl('discharge-salida', dm.horaSalida)}
                    </div>
                    <button type="button" data-action="spellcheck-discharge" class="min-h-[40px] rounded-xl border border-teal-300 bg-teal-50 px-3.5 py-2 text-xs font-bold text-teal-900 hover:bg-teal-100">Rectificar ortografía</button>
                  </div>

                  <div>
                    <span class="block text-xs font-bold text-slate-800 mb-1.5">Estado de egreso</span>
                    <div class="grid grid-cols-1 gap-2 sm:grid-cols-2">
                      ${EXIT_OUTCOMES.map((o) => `
                        <button type="button" data-action="set-discharge-outcome" data-val="${o.value}"
                          class="rounded-xl border p-3 text-left transition-colors ${
                            dm.estadoEgreso === o.value ? 'border-teal-700 bg-teal-50 text-teal-950' : 'border-slate-200 bg-white text-slate-800 hover:bg-slate-50'
                          }">
                          <div class="text-xs font-bold">${o.label}</div>
                          <div class="mt-0.5 text-[11px] text-slate-600">${o.desc}</div>
                        </button>
                      `).join('')}
                    </div>
                  </div>

                  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                      <div class="flex items-center justify-between gap-2 mb-1.5">
                        <label for="d-medico" class="text-xs font-bold text-slate-800">Médico que lo atendió</label>
                        ${renderMicButton('discharge:doctorName', 'médico')}
                      </div>
                      <div class="flex gap-1.5">
                        <select data-discharge-field="doctorTitle" aria-label="Título médico" class="min-h-[42px] rounded-xl border border-slate-300 bg-slate-50 px-2.5 text-xs font-bold text-slate-900">
                          <option value="DR." ${dm.doctorTitle === 'DR.' ? 'selected' : ''}>DR.</option>
                          <option value="DRA." ${dm.doctorTitle === 'DRA.' ? 'selected' : ''}>DRA.</option>
                        </select>
                        <input id="d-medico" data-discharge-field="doctorName" type="text" value="${esc(dm.doctorName)}" placeholder="Nombre y apellidos"
                          class="flex-1 min-h-[42px] rounded-xl border border-slate-300 px-3 text-sm text-slate-900 focus:border-teal-700 focus:outline-none" />
                      </div>
                      <p class="mt-1 text-[11px] text-slate-500">Se guardará como: <strong>${esc(formatDoctor(dm.doctorTitle, dm.doctorName) || '—')}</strong></p>
                    </div>

                    <div>
                      <div class="flex items-center justify-between gap-2 mb-1.5">
                        <label for="d-enfermera" class="text-xs font-bold text-slate-800">Enfermera que lo atendió</label>
                        ${renderMicButton('discharge:nurseName', 'enfermera')}
                      </div>
                      <div class="flex items-center">
                        <span class="inline-flex min-h-[42px] items-center rounded-l-xl border border-r-0 border-slate-300 bg-slate-100 px-3 text-xs font-bold text-slate-700">ENF.</span>
                        <input id="d-enfermera" data-discharge-field="nurseName" type="text" value="${esc(dm.nurseName)}" placeholder="Nombre y apellidos"
                          class="flex-1 min-h-[42px] rounded-r-xl border border-slate-300 px-3 text-sm text-slate-900 focus:border-teal-700 focus:outline-none" />
                      </div>
                      <p class="mt-1 text-[11px] text-slate-500">Se guardará como: <strong>${esc(formatNurse(dm.nurseName) || '—')}</strong></p>
                    </div>
                  </div>

                  <div>
                    <div class="flex items-center justify-between gap-2 mb-1.5">
                      <label for="d-dx" class="text-xs font-bold text-slate-800">Diagnóstico (emitido por personal médico)</label>
                      ${renderMicButton('discharge:diagnostico', 'diagnóstico')}
                    </div>
                    <textarea id="d-dx" data-discharge-field="diagnostico" rows="2" maxlength="1500" placeholder="Diagnóstico clínico de egreso..."
                      class="w-full rounded-xl border border-slate-300 p-3 text-sm text-slate-900 focus:border-teal-700 focus:outline-none">${esc(dm.diagnostico)}</textarea>
                  </div>

                  <div>
                    <div class="flex items-center justify-between gap-2 mb-1.5">
                      <label for="d-obs-sal" class="text-xs font-bold text-slate-800">Observaciones de salida (independiente del ingreso)</label>
                      ${renderMicButton('discharge:observacionesSalida', 'observaciones de salida')}
                    </div>
                    <textarea id="d-obs-sal" data-discharge-field="observacionesSalida" rows="2" maxlength="1500"
                      placeholder="Escribe las observaciones específicas de la salida..."
                      class="w-full rounded-xl border border-slate-300 p-3 text-sm text-slate-900 focus:border-teal-700 focus:outline-none">${esc(dm.observacionesSalida)}</textarea>
                  </div>
                </div>

                <div class="mt-5 flex flex-col-reverse gap-2 border-t border-slate-200 pt-4 sm:flex-row sm:justify-end">
                  <button type="button" data-action="close-discharge" class="min-h-[42px] rounded-xl border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-700">Cancelar</button>
                  <button type="button" data-action="save-discharge" data-open-wa="1" ${state.isSaving ? 'disabled' : ''} class="min-h-[42px] rounded-xl border border-emerald-700 bg-emerald-50 px-4 py-2 text-xs font-bold text-emerald-900 hover:bg-emerald-100">Guardar y abrir WhatsApp</button>
                  <button type="button" data-action="save-discharge" data-open-wa="0" ${state.isSaving ? 'disabled' : ''} class="min-h-[42px] rounded-xl bg-teal-700 px-5 py-2 text-xs font-bold text-white hover:bg-teal-800">Guardar salida</button>
                </div>
              </div>
            </div>`;
        }
      }

      // Modal 2: WhatsApp
      if (state.whatsappModal) {
        const p = state.patients.find((x) => x.id === state.whatsappModal.patientId);
        if (p) {
          const text = buildWhatsAppText(p, state.whatsappModal.type, state.shiftConfig.incluirCamposVaciosEnMensaje);
          const groupUrl = state.shiftConfig.whatsappGroupUrl || DEFAULT_WHATSAPP_GROUP_URL;
          html += `
            <div class="fixed inset-0 z-40 flex items-center justify-center bg-slate-950/60 p-3 sm:p-5">
              <div role="dialog" aria-modal="true" aria-label="Mensaje para WhatsApp" class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-5 sm:p-6">
                <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                  <h2 class="text-base font-bold text-slate-900">Mensaje de ${state.whatsappModal.type === 'salida' ? 'salida' : 'ingreso'} para WhatsApp</h2>
                  <button type="button" data-action="close-whatsapp" class="rounded-lg border border-slate-300 px-3 py-1 text-xs font-semibold text-slate-700">Cerrar</button>
                </div>
                <pre id="wa-preview-text" class="mt-4 max-h-72 overflow-y-auto whitespace-pre-wrap rounded-xl border border-slate-200 bg-slate-50 p-3.5 font-sans text-xs leading-relaxed text-slate-900">${esc(text)}</pre>
                <label class="mt-3 flex items-center gap-2 text-xs text-slate-700">
                  <input type="checkbox" data-action="toggle-wa-empty" ${state.shiftConfig.incluirCamposVaciosEnMensaje ? 'checked' : ''} class="h-4 w-4 rounded border-slate-300 text-teal-700" />
                  <span>Incluir campos vacíos como "No registrado"</span>
                </label>
                <div class="mt-4 flex flex-wrap gap-2">
                  <button type="button" data-action="copy-wa-text" class="flex-1 min-h-[44px] rounded-xl bg-teal-700 px-4 py-2 text-xs font-bold text-white hover:bg-teal-800">Copiar mensaje</button>
                  <a href="${esc(groupUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex flex-1 min-h-[44px] items-center justify-center rounded-xl bg-emerald-700 px-4 py-2 text-xs font-bold text-white hover:bg-emerald-800">Abrir grupo WhatsApp</a>
                </div>
              </div>
            </div>`;
        }
      }

      // Modal 3: Informe PDF y grupo de WhatsApp
      if (state.reportModalOpen) {
        const c = computeCounts(state.patients);
        html += `
          <div class="fixed inset-0 z-40 flex items-center justify-center bg-slate-950/60 p-3 sm:p-5">
            <div role="dialog" aria-modal="true" aria-label="Informe de guardia" class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-5 sm:p-6">
              <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <h2 class="text-base font-bold text-slate-900">Informe de guardia y envío</h2>
                <button type="button" data-action="close-report" class="rounded-lg border border-slate-300 px-3 py-1 text-xs font-semibold text-slate-700">Cerrar</button>
              </div>
              <div class="mt-4 grid grid-cols-3 gap-2 text-center text-xs">
                <div class="rounded-xl border border-slate-200 bg-slate-50 p-2.5"><div class="text-slate-600">Total</div><div class="text-lg font-bold tabular-nums">${c.total}</div></div>
                <div class="rounded-xl border border-emerald-200 bg-emerald-50 p-2.5"><div class="text-emerald-900">Atendidos</div><div class="text-lg font-bold tabular-nums text-emerald-800">${c.atendidos}</div></div>
                <div class="rounded-xl border border-amber-200 bg-amber-50 p-2.5"><div class="text-amber-900">Sin salida</div><div class="text-lg font-bold tabular-nums text-amber-900">${c.enAtencion}</div></div>
              </div>
              <div class="mt-4">
                <label for="wa-group-url" class="block text-xs font-bold text-slate-800 mb-1">Enlace del grupo de WhatsApp</label>
                <div class="flex gap-2">
                  <input id="wa-group-url" type="url" value="${esc(state.shiftConfig.whatsappGroupUrl)}" class="flex-1 min-h-[42px] rounded-xl border border-slate-300 px-3 text-xs text-slate-900" />
                  <button type="button" data-action="save-wa-group" class="min-h-[42px] rounded-xl border border-slate-300 bg-slate-50 px-3 text-xs font-bold text-slate-800 hover:bg-slate-100">Guardar</button>
                </div>
              </div>
              <div class="mt-4 flex flex-col gap-2">
                <button type="button" data-action="download-pdf" class="min-h-[44px] rounded-xl bg-teal-700 px-4 py-2 text-xs font-bold text-white hover:bg-teal-800">Descargar informe PDF compacto (A4)</button>
                <button type="button" data-action="copy-shift-summary" class="min-h-[44px] rounded-xl border border-slate-300 bg-white px-4 py-2 text-xs font-bold text-slate-800 hover:bg-slate-50">Copiar resumen de guardia para WhatsApp</button>
                <a href="${esc(state.shiftConfig.whatsappGroupUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex min-h-[44px] items-center justify-center rounded-xl bg-emerald-700 px-4 py-2 text-xs font-bold text-white hover:bg-emerald-800">Abrir grupo de WhatsApp</a>
              </div>
            </div>
          </div>`;
      }

      // Modal 4: Corrector ortográfico
      if (state.spellModal) {
        const changed = state.spellModal.proposals.filter((p) => p.changed);
        html += `
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 p-3 sm:p-5">
            <div role="dialog" aria-modal="true" aria-label="Revisión de escritura y ortografía" class="w-full max-w-xl rounded-2xl border border-slate-200 bg-white p-5 sm:p-6 max-h-[88vh] overflow-y-auto">
              <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <h2 class="text-base font-bold text-slate-900">Rectificación de escritura y ortografía</h2>
                <button type="button" data-action="close-spell" class="rounded-lg border border-slate-300 px-3 py-1 text-xs font-semibold text-slate-700">Cerrar</button>
              </div>
              ${changed.length === 0 ? `
                <p class="mt-4 text-sm text-emerald-800 font-medium">No se detectaron errores ortográficos ni de formato en los campos capturados.</p>
                <div class="mt-4 flex justify-end"><button type="button" data-action="close-spell" class="min-h-[40px] rounded-xl bg-teal-700 px-4 py-2 text-xs font-bold text-white">Entendido</button></div>
              ` : `
                <div class="mt-4 space-y-3">
                  ${changed.map((item) => `
                    <div class="rounded-xl border border-slate-200 bg-slate-50 p-3 text-xs">
                      <div class="font-bold text-slate-900">${esc(item.label)} · <span class="font-normal text-slate-600">${esc(item.reasons.join(', '))}</span></div>
                      <div class="mt-1 text-slate-500 line-through">${esc(item.original)}</div>
                      <div class="mt-1 font-semibold text-teal-900">${esc(item.proposed)}</div>
                    </div>
                  `).join('')}
                </div>
                <div class="mt-5 flex justify-end gap-2">
                  <button type="button" data-action="close-spell" class="min-h-[42px] rounded-xl border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-700">Cancelar</button>
                  <button type="button" data-action="apply-spell" class="min-h-[42px] rounded-xl bg-teal-700 px-5 py-2 text-xs font-bold text-white hover:bg-teal-800">Aplicar correcciones</button>
                </div>
              `}
            </div>
          </div>`;
      }

      // Modal 5: Eliminación total (Solo cuenta administradora + Doble confirmación)
      if (state.clearModal) {
        const cm = state.clearModal;
        const admin = isAdmin();
        const canConfirm = admin && cm.checked && cm.phrase.trim().toUpperCase() === 'ELIMINAR TODO' && !cm.busy;
        html += `
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 p-3 sm:p-5">
            <div role="dialog" aria-modal="true" aria-label="Eliminar todos los registros" class="w-full max-w-lg rounded-2xl border border-red-200 bg-white p-5 sm:p-6">
              <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <h2 class="text-base font-bold text-red-900">Eliminar todos los registros del turno</h2>
                <button type="button" data-action="close-clear" class="rounded-lg border border-slate-300 px-3 py-1 text-xs font-semibold text-slate-700">Cancelar</button>
              </div>
              ${!admin ? `
                <p class="mt-4 text-sm text-red-800 font-medium">Acceso restringido: solo la cuenta administradora verificada (${ADMIN_EMAIL}) puede eliminar todos los registros de la base de datos compartida.</p>
                <div class="mt-4 flex justify-end"><button type="button" data-action="close-clear" class="min-h-[42px] rounded-xl bg-slate-900 px-4 py-2 text-xs font-bold text-white">Entendido</button></div>
              ` : `
                <p class="mt-3 text-sm text-slate-700">
                  Esta acción eliminará permanentemente los <strong>${state.patients.length}</strong> registros actuales para todos los dispositivos conectados y quedará registrada en la bitácora de auditoría.
                </p>
                <div class="mt-3 flex flex-wrap gap-2">

                </label>

                    class="w-full min-h-[42px] rounded-xl border border-slate-300 px-3 text-sm font-mono-num text-slate-900 focus:border-red-600 focus:outline-none" />
                </div>
                ${cm.error ? `<p class="mt-2 text-xs font-semibold text-red-700">${esc(cm.error)}</p>` : ''}
                <div class="mt-5 flex justify-end gap-2">
                  <button type="button" data-action="close-clear" class="min-h-[42px] rounded-xl border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-700">Cancelar</button>

                    ${cm.busy ? 'Eliminando...' : 'Confirmar eliminación total'}
                  </button>
                </div>
              `}
            </div>
          </div>`;
      }

      return html;
    }

    // =========================================================================
