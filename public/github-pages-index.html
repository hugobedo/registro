    async function submitIntakeForm(openWhatsApp) {
      if (!state.intakeForm) return;
      const f = state.intakeForm;
      state.formError = '';
      state.isSaving = true;
      render();
      try {
        if (state.editingPatientId) {
          const existing = state.patients.find((p) => p.id === state.editingPatientId);
          if (!existing) throw new Error('CONFLICT:El paciente ya no existe en la base compartida.');
          await updatePatientCloud(existing, f);
          const id = existing.id;
          state.editingPatientId = null;
          state.intakeForm = null;
          state.activeView = 'pacientes';
          showToast('Registro actualizado y sincronizado.');
          if (openWhatsApp) state.whatsappModal = { patientId: id, type: hasExit(f) ? 'salida' : 'ingreso' };
        } else {
          const newId = await createPatientCloud(f);
          state.intakeForm = null;
          state.activeView = 'pacientes';
          showToast('Paciente registrado y sincronizado en tiempo real.');
          if (openWhatsApp) state.whatsappModal = { patientId: newId, type: 'ingreso' };
        }
      } catch (err) {
        const msg = err instanceof Error ? err.message : 'No se pudo guardar el registro.';
        if (msg.startsWith('CONFLICT:')) {
          state.conflictNotice = msg.slice('CONFLICT:'.length);
          state.editingPatientId = null;
          state.activeView = 'pacientes';
        } else {
          state.formError = 'Error al guardar en la nube. Verifica tu conexión.';
        }
      } finally {
        state.isSaving = false;
        render();
      }
    }

    document.addEventListener('submit', (e) => {
      if (e.target && e.target.id === 'intake-form') {
        e.preventDefault();
        void submitIntakeForm(false);
      }
    });

    document.addEventListener('input', (e) => {
      const target = e.target;
      if (!(target instanceof HTMLElement)) return;

      if (target.id === 'patient-search') {
        state.searchQuery = target.value;
        const pos = target.selectionStart;
        render();
        const el = document.getElementById('patient-search');
        if (el) { el.focus(); if (pos !== null) el.setSelectionRange(pos, pos); }
        return;
      }

      if (target.dataset.intakeField && state.intakeForm) {
        state.intakeForm[target.dataset.intakeField] = target.value;
        return;
      }

      if (target.dataset.dischargeField && state.dischargeModal) {
        state.dischargeModal[target.dataset.dischargeField] = target.value;
        if (target.dataset.dischargeField === 'doctorName' || target.dataset.dischargeField === 'nurseName') {
          const pos = target.selectionStart;
          const id = target.id;
          render();
          const el = document.getElementById(id);
          if (el) { el.focus(); if (pos !== null) el.setSelectionRange(pos, pos); }
        }
        return;
      }

      if (target.id === 'clear-phrase' && state.clearModal) {
        state.clearModal.phrase = target.value;
        const pos = target.selectionStart;
        render();
        const el = document.getElementById('clear-phrase');
        if (el) { el.focus(); if (pos !== null) el.setSelectionRange(pos, pos); }
      }
    });

    document.addEventListener('change', async (e) => {
      const target = e.target;
      if (!(target instanceof HTMLElement)) return;

      if (target.dataset.timePart) {
        const [prefix, part] = target.dataset.timePart.split(':');
        const current = prefix === 'intake-entrada' ? state.intakeForm?.horaEntrada : state.dischargeModal?.horaSalida;
        const cur = parse24To12(current || nowTime24());
        cur[part] = target.value;
        const next24 = to24From12(cur.h || '12', cur.m || '00', cur.p || 'AM');
        if (prefix === 'intake-entrada' && state.intakeForm) state.intakeForm.horaEntrada = next24;
        if (prefix === 'discharge-salida' && state.dischargeModal) state.dischargeModal.horaSalida = next24;
        render();
        return;
      }

      if (target.dataset.dischargeField === 'doctorTitle' && state.dischargeModal) {
        state.dischargeModal.doctorTitle = target.value === 'DRA.' ? 'DRA.' : 'DR.';
        render();
        return;
      }

      if (target.dataset.action === 'toggle-wa-empty') {
        const checked = target.checked;
        state.shiftConfig.incluirCamposVaciosEnMensaje = checked;
        render();
        await saveShiftConfigCloud({ incluirCamposVaciosEnMensaje: checked });
        return;
      }

      if (target.dataset.action === 'clear-toggle-check' && state.clearModal) {
        state.clearModal.checked = target.checked;
        render();
        return;
      }

      if (target.dataset.action === 'select-request-role' && target.dataset.uid) {
        state.requestRoleDrafts[target.dataset.uid] = target.value === 'admin' ? 'admin' : 'staff';
        return;
      }

      if (target.dataset.action === 'change-staff-role' && target.dataset.uid && isPrimaryAdmin()) {
        const u = state.staffUsers.find((x) => x.uid === target.dataset.uid);
        if (u) {
          const nextRole = target.value === 'admin' ? 'admin' : 'staff';
          state.accessBusyKey = u.uid; state.accessPanelNotice = null; render();
          try {
            await updateStaffAccessCloud(u, true, nextRole);
            const msg = `Se actualizó el rol de ${u.email} a ${nextRole === 'admin' ? 'Administrador' : 'Personal'}.`;
            state.accessPanelNotice = { type: 'ok', text: msg };
            showToast(msg);
          } catch {
            state.accessPanelNotice = { type: 'error', text: 'No se pudo actualizar el rol de la cuenta.' };
          } finally {
            state.accessBusyKey = ''; render();
          }
        }
        return;
      }

      if (target.id === 'restore-json-input' && target.files?.[0]) {
        try {
          const text = await target.files[0].text();
          const parsed = JSON.parse(text);
          const records = Array.isArray(parsed) ? parsed : Array.isArray(parsed?.patients) ? parsed.patients : [];
          if (!records.length) { showToast('El archivo no contiene registros válidos.'); return; }
          const { imported, skipped } = await importBatchToCloud(records, 'restore_backup');
          showToast(`Restauración lista: ${imported} agregados${skipped ? ` (${skipped} duplicados omitidos)` : ''}.`);
        } catch {
          showToast('No se pudo leer el archivo JSON de respaldo.');
        } finally {
          target.value = '';
        }
      }
    });

    document.addEventListener('click', async (e) => {
      const btn = e.target instanceof Element ? e.target.closest('[data-action]') : null;
      if (!btn) return;
      const action = btn.dataset.action;

      switch (action) {
        case 'sign-in': {
          state.isSigningIn = true; state.authError = ''; render();
          try {
            await signInWithPopup(auth, googleProvider);
          } catch (err) {
            const msg = err instanceof Error ? err.message : '';
            if (msg.includes('unauthorized-domain')) {
              state.authError = 'Dominio no autorizado en Firebase. Agrega tu dominio de GitHub Pages en Firebase Console → Authentication → Settings → Authorized domains.';
            } else if (msg.includes('popup-closed-by-user')) {
              state.authError = 'Se cerró la ventana de Google antes de completar el inicio de sesión.';
            } else {
              state.authError = 'No se pudo iniciar sesión con Google. Intenta de nuevo.';
            }
          } finally {
            state.isSigningIn = false; render();
          }
          break;
        }
        case 'sign-out':
          stopVoice();
          await signOut(auth);
          break;
        case 'nav': {
          const view = btn.dataset.view;
          if (view === 'entrada') openNewIntakeForm();
          else { stopVoice(); state.editingPatientId = null; state.activeView = view; render(); }
          break;
        }
        case 'go-entrada':
          openNewIntakeForm();
          break;
        case 'clear-search':
          state.searchQuery = ''; render(); break;
        case 'filter-status':
          state.statusFilter = btn.dataset.status || 'todos'; render(); break;
        case 'reset-filters':
          state.searchQuery = ''; state.statusFilter = 'todos'; render(); break;
        case 'dismiss-conflict':
          state.conflictNotice = ''; render(); break;
        case 'set-tratamiento':
          if (state.intakeForm) { state.intakeForm.tratamiento = btn.dataset.val || 'paciente'; render(); }
          break;
        case 'time-now': {
          const now = nowTime24();
          if (btn.dataset.prefix === 'intake-entrada' && state.intakeForm) state.intakeForm.horaEntrada = now;
          if (btn.dataset.prefix === 'discharge-salida' && state.dischargeModal) state.dischargeModal.horaSalida = now;
          render();
          break;
        }
        case 'append-suggestion': {
          const field = btn.dataset.target;
          const txt = btn.dataset.text || '';
          if (state.intakeForm && field) {
            const cur = (state.intakeForm[field] || '').trim();
            state.intakeForm[field] = cur ? `${cur}, ${txt.toLowerCase()}` : txt;
            render();
          }
          break;
        }
        case 'voice': {
          const vKey = btn.dataset.voiceKey || '';
          const [scope, field] = vKey.split(':');
          toggleVoice(vKey, (spoken) => {
            if (scope === 'intake' && state.intakeForm) {
              const cur = (state.intakeForm[field] || '').trim();
              state.intakeForm[field] = cur ? `${cur} ${spoken}` : spoken;
            } else if (scope === 'discharge' && state.dischargeModal) {
              const cur = (state.dischargeModal[field] || '').trim();
              state.dischargeModal[field] = cur ? `${cur} ${spoken}` : spoken;
            }
          });
          break;
        }
        case 'spellcheck-intake': {
          if (!state.intakeForm) break;
          const f = state.intakeForm;
          const proposals = [
            reviewTextField('nombre', 'Nombre', f.nombre),
            reviewTextField('edad', 'Edad', f.edad),
            reviewTextField('procedencia', 'Procedencia', f.procedencia),
            reviewTextField('motivoVisita', 'Motivo de visita', f.motivoVisita),
            reviewTextField('observaciones', 'Observaciones de ingreso', f.observaciones)
          ];
          state.spellModal = {
            proposals,
            onApply: () => {
              for (const p of proposals) if (p.changed && state.intakeForm) state.intakeForm[p.field] = p.proposed;
              showToast('Ortografía rectificada.');
            }
          };
          render();
          break;
        }
        case 'spellcheck-discharge': {
          if (!state.dischargeModal) break;
          const dm = state.dischargeModal;
          const proposals = [
            reviewTextField('medico', 'Médico', dm.doctorName),
            reviewTextField('enfermera', 'Enfermera', dm.nurseName),
            reviewTextField('diagnostico', 'Diagnóstico', dm.diagnostico),
            reviewTextField('observacionesSalida', 'Observaciones de salida', dm.observacionesSalida)
          ];
          state.spellModal = {
            proposals,
            onApply: () => {
              for (const p of proposals) {
                if (!p.changed || !state.dischargeModal) continue;
                if (p.field === 'medico') state.dischargeModal.doctorName = stripDoctorPrefix(p.proposed);
                else if (p.field === 'enfermera') state.dischargeModal.nurseName = stripNursePrefix(p.proposed);
                else state.dischargeModal[p.field] = p.proposed;
              }
              showToast('Ortografía de salida rectificada.');
            }
          };
          render();
          break;
        }
        case 'apply-spell':
          if (state.spellModal) { state.spellModal.onApply(); state.spellModal = null; render(); }
          break;
        case 'close-spell':
          state.spellModal = null; render(); break;
        case 'save-intake-wa':
          await submitIntakeForm(true); break;
        case 'cancel-intake':
          stopVoice(); state.editingPatientId = null; state.intakeForm = null; state.activeView = 'pacientes'; render(); break;
        case 'edit-patient': {
          const p = state.patients.find((x) => x.id === btn.dataset.id);
          if (p) openEditIntakeForm(p);
          break;
        }
        case 'ask-delete-one':
          state.deleteConfirmPatientId = btn.dataset.id; render(); break;
        case 'cancel-delete-one':
          state.deleteConfirmPatientId = null; render(); break;
        case 'confirm-delete-one': {
          const p = state.patients.find((x) => x.id === btn.dataset.id);
          state.deleteConfirmPatientId = null;
          if (p) { await deleteSinglePatientCloud(p); showToast('Registro eliminado de la base compartida.'); }
          render();
          break;
        }
        case 'open-discharge': {
          const p = state.patients.find((x) => x.id === btn.dataset.id);
          if (p) openDischargeModal(p);
          break;
        }
        case 'close-discharge':
          stopVoice(); state.dischargeModal = null; render(); break;
        case 'set-discharge-outcome':
          if (state.dischargeModal) { state.dischargeModal.estadoEgreso = btn.dataset.val; render(); }
          break;
        case 'save-discharge': {
          if (!state.dischargeModal) break;
          const dm = state.dischargeModal;
          const p = state.patients.find((x) => x.id === dm.patientId);
          if (!p) { state.dischargeModal = null; render(); break; }
          state.isSaving = true; render();
          try {
            await registerDischargeCloud(p, {
              horaSalida: dm.horaSalida,
              estadoEgreso: dm.estadoEgreso,
              observacionesSalida: dm.observacionesSalida,
              medico: formatDoctor(dm.doctorTitle, dm.doctorName),
              enfermera: formatNurse(dm.nurseName),
              diagnostico: dm.diagnostico
            });
            const openWa = btn.dataset.openWa === '1';
            const pid = p.id;
            state.dischargeModal = null;
            showToast('Salida registrada y sincronizada en tiempo real.');
            if (openWa) state.whatsappModal = { patientId: pid, type: 'salida' };
          } catch (err) {
            const msg = err instanceof Error ? err.message : '';
            if (msg.startsWith('CONFLICT:')) {
              state.conflictNotice = msg.slice('CONFLICT:'.length);
              state.dischargeModal = null;
            } else {
              dm.error = 'No se pudo guardar la salida. Intenta nuevamente.';
            }
          } finally {
            state.isSaving = false; render();
          }
          break;
        }
        case 'open-whatsapp':
          state.whatsappModal = { patientId: btn.dataset.id, type: btn.dataset.type === 'salida' ? 'salida' : 'ingreso' };
          render();
          break;
        case 'close-whatsapp':
          state.whatsappModal = null; render(); break;
        case 'copy-wa-text': {
          const el = document.getElementById('wa-preview-text');
          if (el) {
            await navigator.clipboard.writeText(el.textContent || '');
            showToast('Mensaje copiado. Pégalo en el grupo de WhatsApp.');
          }
          break;
        }
        case 'open-report':
          state.reportModalOpen = true; render(); break;
        case 'close-report':
          state.reportModalOpen = false; render(); break;
        case 'save-wa-group': {
          const inp = document.getElementById('wa-group-url');
          const url = inp ? inp.value.trim() : '';
          if (url && !/^https:\/\/(chat\.whatsapp\.com|wa\.me)\//i.test(url)) {
            showToast('Ingresa un enlace válido de WhatsApp (https://chat.whatsapp.com/...).');
            break;
          }
          await saveShiftConfigCloud({ whatsappGroupUrl: url || DEFAULT_WHATSAPP_GROUP_URL });
          showToast('Enlace del grupo actualizado y sincronizado.');
          break;
        }
        case 'copy-shift-summary':
          await navigator.clipboard.writeText(buildShiftSummaryText(state.patients));
          showToast('Resumen de guardia copiado al portapapeles.');
          break;
        case 'download-pdf':
          generateShiftPdf(state.patients); break;
        case 'export-json':
          exportBackupJson(state.patients); break;
        case 'open-clear-modal':
          state.clearModal = { checked: false, phrase: '', busy: false, error: '' }; render(); break;
        case 'close-clear':
          state.clearModal = null; render(); break;
        case 'execute-clear-all': {
          if (!state.clearModal || !isAdmin()) break;
          state.clearModal.busy = true; state.clearModal.error = ''; render();
          try {
            const removed = await deleteAllPatientsCloud(state.patients);
            state.clearModal = null;
            state.editingPatientId = null;
            state.dischargeModal = null;
            state.whatsappModal = null;
            state.activeView = 'pacientes';
            showToast(`Se eliminaron ${removed} registros y quedó registrado en auditoría.`);
          } catch {
            state.clearModal.busy = false;
            state.clearModal.error = 'No se pudieron eliminar todos los registros.';
          }
          render();
          break;
        }
        case 'submit-access-request': {
          state.isSubmittingRequest = true; state.requestFeedback = null; render();
          try {
            await submitAccessRequestCloud();
            state.requestFeedback = {
              type: 'ok',
              text: 'Tu solicitud de acceso fue enviada correctamente. Espera la autorización del administrador.'
            };
          } catch (err) {
            state.requestFeedback = {
              type: 'error',
              text: err instanceof Error ? err.message : 'No se pudo enviar tu solicitud de acceso.'
            };
          } finally {
            state.isSubmittingRequest = false; render();
          }
          break;
        }
        case 'set-access-subtab': {
          state.accessSubTab = btn.dataset.tab === 'staff' ? 'staff' : 'requests';
          render();
          break;
        }
        case 'refresh-access-requests': {
          await refreshAccessRequestsFromServer();
          break;
        }
        case 'approve-access-request': {
          if (!isPrimaryAdmin()) break;
          const req = state.accessRequests.find((r) => r.uid === btn.dataset.uid);
          if (req) {
            const role = state.requestRoleDrafts[req.uid] === 'admin' ? 'admin' : 'staff';
            state.accessBusyKey = req.uid; state.accessPanelNotice = null; render();
            try {
              await approveAccessRequestCloud(req, role);
              const msg = `Solicitud aprobada: ${req.email} agregado como ${role === 'admin' ? 'Administrador' : 'Personal'}.`;
              state.accessPanelNotice = { type: 'ok', text: msg };
              showToast(msg);
            } catch {
              state.accessPanelNotice = { type: 'error', text: 'No se pudo aprobar la solicitud de acceso.' };
            } finally {
              state.accessBusyKey = ''; render();
            }
          }
          break;
        }
        case 'reject-access-request': {
          if (!isPrimaryAdmin()) break;
          const req = state.accessRequests.find((r) => r.uid === btn.dataset.uid);
          if (req) {
            state.accessBusyKey = req.uid; state.accessPanelNotice = null; render();
            try {
              await rejectAccessRequestCloud(req);
              const msg = `Solicitud rechazada para ${req.email}.`;
              state.accessPanelNotice = { type: 'ok', text: msg };
              showToast(msg);
            } catch {
              state.accessPanelNotice = { type: 'error', text: 'No se pudo rechazar la solicitud de acceso.' };
            } finally {
              state.accessBusyKey = ''; render();
            }
          }
          break;
        }
        case 'revoke-staff-access': {
          if (!isPrimaryAdmin()) break;
          const u = state.staffUsers.find((x) => x.uid === btn.dataset.uid);
          if (u) {
            state.accessBusyKey = u.uid; state.accessPanelNotice = null; render();
            try {
              await updateStaffAccessCloud(u, false, u.role);
              const msg = `Se revocó el acceso de ${u.email}.`;
              state.accessPanelNotice = { type: 'ok', text: msg };
              showToast(msg);
            } catch {
              state.accessPanelNotice = { type: 'error', text: 'No se pudo revocar el acceso.' };
            } finally {
              state.accessBusyKey = ''; render();
            }
          }
          break;
        }
      }
    });

    render();
  </script>
</body>
</html>
