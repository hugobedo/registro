    function parse24To12(t24) {
      const m = /^(\d{1,2}):(\d{2})$/.exec(String(t24 || '').trim());
      if (!m) return { h: '', m: '', p: 'AM' };
      const h24 = parseInt(m[1], 10);
      const min = parseInt(m[2], 10);
      if (h24 < 0 || h24 > 23 || min < 0 || min > 59) return { h: '', m: '', p: 'AM' };
      return { h: String(h24 % 12 === 0 ? 12 : h24 % 12), m: pad2(min), p: h24 >= 12 ? 'PM' : 'AM' };
    }

    function to24From12(h, m, p) {
      const hi = parseInt(h, 10);
      const mi = parseInt(m, 10);
      if (Number.isNaN(hi) || Number.isNaN(mi) || hi < 1 || hi > 12 || mi < 0 || mi > 59) return '';
      let h24 = hi % 12;
      if (p === 'PM') h24 += 12;
      return `${pad2(h24)}:${pad2(mi)}`;
    }

    function fmt12(t24) {
      const x = parse24To12(t24);
      if (!x.h) return '';
      return `${pad2(x.h)}:${x.m} ${x.p === 'PM' ? 'p. m.' : 'a. m.'}`;
    }

    function fmtDateEs(d = new Date()) {
      const s = new Intl.DateTimeFormat('es-MX', {

    function getTodayIsoDate(d = new Date()) {
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function normalizeIsoDate(raw) {
      if (typeof raw !== 'string') return '';
      const trimmed = raw.trim();
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(trimmed);
      if (!m) return '';
      const y = Number(m[1]);
      const mo = Number(m[2]);
      const da = Number(m[3]);
      if (mo < 1 || mo > 12 || da < 1 || da > 31 || y < 2000 || y > 2100) return '';
      return trimmed;
    }

    function extractIsoDateFromTimestamp(iso) {
      if (!iso) return '';
      const dt = new Date(iso);
      if (Number.isNaN(dt.getTime())) return '';
      return getTodayIsoDate(dt);
    }

    function formatIsoDateEs(isoDate) {
      const norm = normalizeIsoDate(isoDate);
      if (!norm) return '';
      const [y, mo, da] = norm.split('-');
      return `${da}/${mo}/${y}`;
    }

    function timeToMinutes(t24) {
      const m = /^(\d{1,2}):(\d{2})$/.exec(String(t24 || '').trim());
      if (!m) return Number.MAX_SAFE_INTEGER;
      return Number(m[1]) * 60 + Number(m[2]);

    function compareByRegistrationOrder(a, b) {
      const tA = Date.parse(a.createdAt || '');
      const tB = Date.parse(b.createdAt || '');
      if (!Number.isNaN(tA) && !Number.isNaN(tB) && tA !== tB) return tA - tB;
      const isoDiff = String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
      if (isoDiff !== 0) return isoDiff;
      const dateDiff = String(a.fechaRegistro || '').localeCompare(String(b.fechaRegistro || ''));
      if (dateDiff !== 0) return dateDiff;
      const entryDiff = timeToMinutes(a.horaEntrada) - timeToMinutes(b.horaEntrada);
      if (entryDiff !== 0) return entryDiff;
      return String(a.id || '').localeCompare(String(b.id || ''));
    }

    async function verifyDeletePasscode(candidate) {
      const now = Date.now();
      if (now < deleteLockedUntil) {
        const secs = Math.ceil((deleteLockedUntil - now) / 1000);
        return { ok: false, message: `Demasiados intentos fallidos. Espera ${secs} s antes de reintentar.` };
      }
      const clean = String(candidate || '').trim();
      if (!clean) {
        return { ok: false, message: 'Ingresa la contraseña de autorización.' };
      }
      if (!window.crypto?.subtle) {
        return { ok: false, message: 'Este navegador no admite verificación criptográfica segura.' };
      }
      const data = new TextEncoder().encode(`${DELETE_PASSCODE_SALT}:${clean}`);
      const buf = await window.crypto.subtle.digest('SHA-256', data);
      const hex = Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
      let diff = hex.length ^ DELETE_PASSCODE_DIGEST.length;
      for (let i = 0; i < Math.min(hex.length, DELETE_PASSCODE_DIGEST.length); i++) {
        diff |= hex.charCodeAt(i) ^ DELETE_PASSCODE_DIGEST.charCodeAt(i);
      }
      if (diff === 0) {
        deleteFailedAttempts = 0;
        deleteLockedUntil = 0;
        return { ok: true, message: '' };
      }
      deleteFailedAttempts += 1;
      if (deleteFailedAttempts >= MAX_DELETE_ATTEMPTS) {
        deleteLockedUntil = Date.now() + DELETE_LOCKOUT_MS;
        deleteFailedAttempts = 0;
        return { ok: false, message: 'Contraseña incorrecta. Intenta de nuevo en 30 segundos.' };
      }
      return { ok: false, message: 'Contraseña incorrecta. Verifica e intenta nuevamente.' };
    }

    function stripDoctorPrefix(raw) {

      while (re.test(s)) s = s.replace(re, '').trim();

    function titleCaseEs(str) {
      const small = new Set(['de', 'del', 'la', 'las', 'los', 'y', 'e', 'en', 'el', 'san', 'santa']);
      return str.split(/\s+/).map((w, i) => {
        if (!w) return '';
        if (/^(DR\.|DRA\.|ENF\.)$/i.test(w)) return w.toUpperCase();
        const l = w.toLowerCase();
        return i > 0 && small.has(l) ? l : l.charAt(0).toUpperCase() + l.slice(1);
      }).join(' ');
    }

    function reviewTextField(field, label, raw) {
      const original = String(raw || '');
      if (!original.trim()) return { field, label, original, proposed: original, changed: false, reasons: [] };
      let next = original.replace(/\s+/g, ' ').trim();
      const reasons = [];
      if (next !== original) reasons.push('Espacios normalizados');

      if (field === 'edad') {
        if (/^\d{1,3}$/.test(next)) {
          next = `${next} años`;
          reasons.push('Unidad agregada');
        } else {
          next = next.replace(/\banos\b/gi, 'años');
        }
      } else if (['nombre', 'procedencia', 'medico', 'enfermera'].includes(field)) {
        const titled = titleCaseEs(next);
        if (titled !== next) {
          next = titled;
          reasons.push('Mayúsculas en nombre propio');
        }
      } else {
        let fixed = false;
        for (const wrong of Object.keys(SPELL_MAP).sort((a, b) => b.length - a.length)) {
          const right = SPELL_MAP[wrong];
          const re = new RegExp(`(?<![\\p{L}])${wrong.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(?![\\p{L}])`, 'giu');
          next = next.replace(re, (m) => {
            fixed = true;
            if (m === m.toUpperCase() && m.length > 1) return right.toUpperCase();
            if (m[0] === m[0].toUpperCase()) return right.charAt(0).toUpperCase() + right.slice(1);
            return right;
          });
        }
        if (fixed) reasons.push('Ortografía y acentos');
        const cap = next.charAt(0).toUpperCase() + next.slice(1);
        if (cap !== next) {
          next = cap;
          reasons.push('Mayúscula inicial');
        }
      }
      return { field, label, original, proposed: next, changed: next !== original, reasons };
    }

    // =========================================================================
    // 4. DICTADO POR VOZ (Web Speech API es-MX)
    // =========================================================================
    function voiceSupported() {
      return typeof window !== 'undefined' && ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window);
    }

    function stopVoice() {
      if (recognition) {
        try { recognition.stop(); } catch {}
        recognition = null;
      }
      state.activeVoiceKey = null;
    }

    function toggleVoice(key, onAppend) {
      if (!voiceSupported()) {
        showToast('Tu navegador no admite dictado por voz. Usa Chrome o Edge.');
        return;
      }
      if (state.activeVoiceKey === key) {
        stopVoice();
        render();
        return;
      }
      stopVoice();
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const rec = new SR();
      rec.lang = 'es-MX';
      rec.continuous = false;
      rec.interimResults = false;
      recognition = rec;
      state.activeVoiceKey = key;
      render();

      rec.onresult = (ev) => {
        let text = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          if (ev.results[i].isFinal) text += ev.results[i][0].transcript;
        }
        const clean = text.trim();
        if (clean) {
          onAppend(clean);
          showToast('Dictado agregado al campo.');
          render();
        }
      };
      rec.onerror = (ev) => {
        if (ev.error === 'not-allowed') showToast('Permiso de micrófono denegado.');
        else if (ev.error !== 'no-speech' && ev.error !== 'aborted') showToast('No se pudo capturar el audio.');
      };
      rec.onend = () => {
        if (state.activeVoiceKey === key) {
          state.activeVoiceKey = null;
          recognition = null;
          render();
        }
      };
      try {
        rec.start();
      } catch {
        state.activeVoiceKey = null;
        recognition = null;
        showToast('No se pudo iniciar el micrófono.');
        render();
      }
    }

        const clean = String(val || '').trim();

      add('Hora de entrada', fmt12(p.horaEntrada));
      add('Hora de salida', fmt12(p.horaSalida));
      add('Fecha', formatIsoDateEs(p.fechaRegistro));
      if (type === 'salida') {

      }
      if (type === 'salida' && outcome !== 'en_atencion') {
        add('Estado de egreso', outcomeLabel(outcome));

      if (type === 'salida') {
        add('Tipo de alta', hospitalizationDischargeLabel(p.tipoAltaHospitalizacion));
        add('Destino del traslado', p.destinoTraslado);
      }
      add(treatmentLabel(p.tratamiento), p.nombre);

        if ((p.motivoVisita || '').trim()) clinParts.push(`Motivo de visita: ${p.motivoVisita.trim()}`);
        if ((p.destinoTraslado || '').trim()) clinParts.push(`Destino del traslado: ${p.destinoTraslado.trim()}`);

        const boxH = bodyCount > 0 ? headerBarH + bodyCount * lineH + 3.2 : headerBarH + 0.6;

        pdf.setDrawColor(st.border[0], st.border[1], st.border[2]);
        pdf.rect(margin + 0.2, y + 0.2, w - 0.4, headerBarH, 'F');
        if (bodyCount > 0) pdf.line(margin, y + headerBarH, pageW - margin, y + headerBarH);

        const hTextY = y + 3.8;
        pdf.setFont('helvetica', 'bold');
        pdf.setFontSize(8);
        pdf.setTextColor(15, 23, 42);

        if (entry) sched.push(`Entrada ${entry}`);
        if (exit) sched.push(`Salida ${exit}`);
        pdf.text(sched.join('  ·  '), margin + 3, hTextY);

        pdf.setTextColor(st.text[0], st.text[1], st.text[2]);
        pdf.text(st.badge, pageW - margin - 3, hTextY, { align: 'right' });

          pdf.setFont('helvetica', 'normal');
          pdf.setFontSize(8);
          pdf.setTextColor(30, 41, 59);
          for (const wr of wrappedRows) {

      if (sorted.length === 0) {

        pdf.setFont('helvetica', 'italic');
        pdf.setFontSize(8.5);

      pdf.save(fname);
      showToast(`Informe descargado: ${fname}`);
    }

      return Boolean(u && u.email && u.email.toLowerCase() === ADMIN_EMAIL && u.emailVerified);
    }

      return isBootAdmin(state.user);
    }

    function isAdmin() {
      return isBootAdmin(state.user) || Boolean(state.profile?.role === 'admin' && state.profile?.approved);
    }

    function mapPatientDoc(id, d) {
      const horaSalida = typeof d.horaSalida === 'string' ? d.horaSalida : '';
      const createdAt = typeof d.createdAtIso === 'string' && d.createdAtIso ? d.createdAtIso : new Date().toISOString();
      const updatedAt = typeof d.updatedAtIso === 'string' && d.updatedAtIso ? d.updatedAtIso : createdAt;
      const fechaRegistro = normalizeIsoDate(d.fechaRegistro) || extractIsoDateFromTimestamp(createdAt);
      return {
        id,
        workspaceId: d.workspaceId || WORKSPACE_ID,
        createdAt,
        updatedAt,
        fechaRegistro,
        fechaSalida: normalizeIsoDate(d.fechaSalida),
        horaEntrada: typeof d.horaEntrada === 'string' ? d.horaEntrada : '',
        horaSalida,
        estadoEgreso: ['en_atencion', 'atendido', 'no_espero_turno', 'no_atendido', 'trasladado', 'hospitalizado'].includes(d.estadoEgreso)
          ? d.estadoEgreso : (horaSalida ? 'atendido' : 'en_atencion'),
        tipoAltaHospitalizacion: parseHospitalizationDischargeType(d.tipoAltaHospitalizacion),
        destinoTraslado: typeof d.destinoTraslado === 'string' ? d.destinoTraslado : '',
        tratamiento: ['paciente', 'usuario', 'usuaria'].includes(d.tratamiento) ? d.tratamiento : 'paciente',
        nombre: typeof d.nombre === 'string' ? d.nombre : '',
        edad: typeof d.edad === 'string' ? d.edad : '',
        procedencia: typeof d.procedencia === 'string' ? d.procedencia : '',
        motivoVisita: typeof d.motivoVisita === 'string' ? d.motivoVisita : '',
        observaciones: typeof d.observaciones === 'string' ? d.observaciones : '',
        observacionesSalida: typeof d.observacionesSalida === 'string' ? d.observacionesSalida : '',
        medico: typeof d.medico === 'string' ? d.medico : '',
        enfermera: typeof d.enfermera === 'string' ? d.enfermera : '',
        diagnostico: typeof d.diagnostico === 'string' ? d.diagnostico : '',
        version: typeof d.version === 'number' && d.version >= 1 ? d.version : 1,
        createdByEmail: typeof d.createdByEmail === 'string' ? d.createdByEmail : '',
        updatedByEmail: typeof d.updatedByEmail === 'string' ? d.updatedByEmail : ''

    }

    async function ensureUserProfile(user) {
      const path = `users/${user.uid}`;
      const ref = doc(db, 'users', user.uid);
      const boot = isBootAdmin(user);
      try {
        const snap = await getDoc(ref);
        if (snap.exists()) {
          const data = snap.data();
          const displayName = clamp(user.displayName || data.displayName || user.email || '', 150);
          if (displayName && displayName !== data.displayName) {
            await updateDoc(ref, { displayName, updatedAt: serverTimestamp() });
          }
          return {
            uid: user.uid,
            email: String(data.email || user.email || ''),
            displayName: displayName || String(data.email || ''),
            role: data.role === 'admin' || boot ? 'admin' : 'staff',
            approved: Boolean(data.approved) || boot
          };
        }
        const payload = {
          uid: user.uid,
          email: clamp(user.email || '', 200),
          displayName: clamp(user.displayName || user.email || 'Personal clínico', 150),
          role: boot ? 'admin' : 'staff',
          approved: boot,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        };
        await setDoc(ref, payload);
        return { uid: user.uid, email: payload.email, displayName: payload.displayName, role: payload.role, approved: payload.approved };
      } catch (err) {
        handleFirestoreError(err, OperationType.WRITE, path);
      }
    }

    async function importBatchToCloud(rawRecords, actionType) {
      const u = state.user;
      const existingIds = new Set(state.patients.map((p) => p.id));
      let imported = 0;
      let skipped = 0;
      const toInsert = [];
      for (const item of rawRecords) {
        if (!item || typeof item !== 'object') continue;
        const id = safeId('pac', item.id);
        if (existingIds.has(id)) { skipped++; continue; }
        existingIds.add(id);
        const nowIso = new Date().toISOString();
        const hs = clamp(item.horaSalida || '', 10);
        const st = ['atendido', 'no_espero_turno', 'no_atendido', 'trasladado', 'hospitalizado'].includes(item.estadoEgreso)
          ? item.estadoEgreso : (hs ? 'atendido' : 'en_atencion');
        toInsert.push({
          id,
          payload: {
            id,
            workspaceId: WORKSPACE_ID,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
            createdAtIso: clamp(item.createdAt || nowIso, 40) || nowIso,
            updatedAtIso: nowIso,
            createdByUid: u.uid,
            createdByEmail: clamp(u.email || '', 200),
            updatedByUid: u.uid,
            updatedByEmail: clamp(u.email || '', 200),
            version: 1,
            fechaRegistro: normalizeIsoDate(item.fechaRegistro) || extractIsoDateFromTimestamp(item.createdAt || nowIso) || getTodayIsoDate(),
            fechaSalida: normalizeIsoDate(item.fechaSalida),
            horaEntrada: clamp(item.horaEntrada || '', 10),
            horaSalida: hs,
            estadoEgreso: st,
            tipoAltaHospitalizacion: parseHospitalizationDischargeType(item.tipoAltaHospitalizacion),
            destinoTraslado: clamp(item.destinoTraslado || '', 200),
            tratamiento: ['paciente', 'usuario', 'usuaria'].includes(item.tratamiento) ? item.tratamiento : 'paciente',
            nombre: clamp(item.nombre || '', 200),
            edad: clamp(item.edad || '', 60),
            procedencia: clamp(item.procedencia || '', 200),
            motivoVisita: clamp(item.motivoVisita || '', 1000),
            observaciones: clamp(item.observaciones || '', 1500),
            observacionesSalida: clamp(item.observacionesSalida || '', 1500),
            medico: clamp(item.medico || '', 200),
            enfermera: clamp(item.enfermera || '', 200),
            diagnostico: clamp(item.diagnostico || '', 1500)
          }
        });
      }
      try {
        for (let i = 0; i < toInsert.length; i += 400) {
          const batch = writeBatch(db);
          for (const row of toInsert.slice(i, i + 400)) {
            batch.set(doc(db, 'patients', row.id), row.payload);
            imported++;
          }
          await batch.commit();
        }
        if (imported > 0) {
          await writeAuditLog(
            actionType,
            actionType === 'migrate_local'
              ? `Migró ${imported} registros locales a la nube`
              : `Restauró ${imported} registros desde respaldo JSON`,
            imported,
            ''
          );
        }
        return { imported, skipped };
      } catch (err) {
        handleFirestoreError(err, OperationType.WRITE, 'patients');
      }
    }

    function formatFirestoreQueryError(err, fallback) {
      if (err && typeof err === 'object') {
        const code = typeof err.code === 'string' ? err.code.trim() : '';
        const msg = typeof err.message === 'string' ? err.message.trim() : '';
        if (code && msg) return msg.includes(code) ? msg : `[${code}] ${msg}`;
        if (msg) return msg;
        if (code) return `[${code}] ${fallback}`;
      }
      if (typeof err === 'string' && err.trim()) return err.trim();
      return fallback;
    }

    function extractAccessRequestIso(d) {
      for (const candidate of [d.requestedAt, d.requestedAtIso]) {
        if (typeof candidate === 'string' && candidate.trim()) return candidate.trim();
        if (typeof candidate === 'number' && Number.isFinite(candidate)) {
          const dt = new Date(candidate);
          if (!Number.isNaN(dt.getTime())) return dt.toISOString();
        }
        if (candidate && typeof candidate === 'object' && typeof candidate.toDate === 'function') {
          const dt = candidate.toDate();
          if (!Number.isNaN(dt.getTime())) return dt.toISOString();
        }
        if (candidate && typeof candidate === 'object') {
          const rawSeconds = typeof candidate.seconds === 'number'
            ? candidate.seconds
            : (typeof candidate._seconds === 'number' ? candidate._seconds : null);
          if (rawSeconds !== null) {
            const dt = new Date(rawSeconds * 1000);
            if (!Number.isNaN(dt.getTime())) return dt.toISOString();
          }
        }
      }
      return '';
    }

    function parseAccessRequestStatus(raw) {
      if (raw === 'pendiente' || raw === 'aprobada' || raw === 'rechazada') return raw;
      return null;
    }

    function mapAccessRequestDoc(docId, d) {
      const status = parseAccessRequestStatus(d.status);
      if (!status) return null;
      const assignedRole = d.assignedRole === 'admin' || d.assignedRole === 'staff' ? d.assignedRole : '';
      const uid = typeof d.uid === 'string' && d.uid.trim() ? d.uid.trim() : docId;
      return {
        uid,
        email: typeof d.email === 'string' ? d.email : '',
        displayName: typeof d.displayName === 'string' ? d.displayName : '',
        status,
        requestedAtIso: extractAccessRequestIso(d),
        reviewedByUid: String(d.reviewedByUid || ''),
        reviewedByEmail: String(d.reviewedByEmail || ''),
        reviewedAtIso: String(d.reviewedAtIso || ''),
        assignedRole
      };
    }

    let accessSyncEpoch = 0;

    async function fetchPendingAccessRequestsFromServer() {
      const q = query(collection(db, 'access_requests'), where('status', '==', 'pendiente'));
      try {
        const snap = await getDocsFromServer(q);
        return snap.docs
          .map((d) => mapAccessRequestDoc(d.id, d.data()))
          .filter((item) => item !== null && item.status === 'pendiente')
          .sort((a, b) => b.requestedAtIso.localeCompare(a.requestedAtIso));
      } catch (err) {
        const readable = formatFirestoreQueryError(err, 'Error al consultar las solicitudes de acceso en Firestore.');
        try { handleFirestoreError(err, OperationType.LIST, 'access_requests'); } catch {}
        throw new Error(readable);
      }
    }

    async function refreshAccessRequestsFromServer() {
      if (!isPrimaryAdmin()) return;
      const epoch = ++accessSyncEpoch;
      state.accessRequestsLoading = true;
      state.accessRequestsError = '';
      render();
      try {
        const list = await fetchPendingAccessRequestsFromServer();
        if (epoch !== accessSyncEpoch) return;
        state.accessRequests = list;
        state.accessRequestsError = '';
      } catch (err) {
        if (epoch !== accessSyncEpoch) return;
        state.accessRequestsError = err instanceof Error ? err.message : 'Error al consultar las solicitudes de acceso en Firestore.';
      } finally {
        if (epoch === accessSyncEpoch) {
          state.accessRequestsLoading = false;
          render();
        }
      }
    }

    function clearSubscriptions() {
      for (const fn of state.unsubs) { try { fn(); } catch {} }
      state.unsubs = [];
    }

    function startDataSubscriptions() {
      clearSubscriptions();
      if (!state.user || !isAuthorized()) return;

      const uPatients = onSnapshot(
        query(collection(db, 'patients'), where('workspaceId', '==', WORKSPACE_ID)),
        { includeMetadataChanges: true },
        (snap) => {
          state.patients = snap.docs
            .map((d) => mapPatientDoc(d.id, d.data()))
            .sort(compareByRegistrationOrder);
          state.fromCache = snap.metadata.fromCache;
          state.patientsLoaded = true;
          void maybeMigrateLegacyLocal();
          render();
        },
        (err) => {
          state.runtimeError = 'Error al sincronizar pacientes con Firestore.';
          render();
          handleFirestoreError(err, OperationType.LIST, 'patients');
        }
      );

      const uConfig = onSnapshot(
        doc(db, 'shift_config', 'current'),
        (snap) => {
          if (snap.exists()) {
            const d = snap.data();
            state.shiftConfig = {
              workspaceId: WORKSPACE_ID,
              responsableGuardia: DEFAULT_SHIFT_SUPERVISOR,
              whatsappGroupUrl: typeof d.whatsappGroupUrl === 'string' && d.whatsappGroupUrl ? d.whatsappGroupUrl : DEFAULT_WHATSAPP_GROUP_URL,
              incluirCamposVaciosEnMensaje: Boolean(d.incluirCamposVaciosEnMensaje)
            };
            render();
          }
        },
        (err) => handleFirestoreError(err, OperationType.GET, 'shift_config/current')
      );

      const uLogs = onSnapshot(
        query(collection(db, 'audit_logs'), where('workspaceId', '==', WORKSPACE_ID)),
        (snap) => {
          state.auditLogs = snap.docs
            .map((d) => d.data())
            .sort((a, b) => String(b.createdAtIso || '').localeCompare(String(a.createdAtIso || '')))
            .slice(0, 80);
          render();
        },
        (err) => handleFirestoreError(err, OperationType.LIST, 'audit_logs')
      );

      state.unsubs.push(uPatients, uConfig, uLogs);

      if (isPrimaryAdmin()) {
        const epoch = ++accessSyncEpoch;
        state.staffUsersError = '';
        state.accessRequestsError = '';
        state.accessRequestsLoading = true;
        const uStaff = onSnapshot(
          query(collection(db, 'users'), where('approved', '==', true)),
          (snap) => {
            state.staffUsersError = '';
            state.staffUsers = snap.docs
              .map((d) => {
                const x = d.data();
                return {
                  uid: typeof x.uid === 'string' && x.uid.trim() ? x.uid.trim() : d.id,
                  email: String(x.email || ''),
                  displayName: String(x.displayName || ''),
                  role: x.role === 'admin' ? 'admin' : 'staff',
                  approved: Boolean(x.approved)
                };
              })
              .sort((a, b) => (a.role !== b.role ? (a.role === 'admin' ? -1 : 1) : a.email.localeCompare(b.email)));
            render();
          },
          (err) => {
            state.staffUsersError = formatFirestoreQueryError(err, 'Error al consultar el personal autorizado.');
            render();
            try { handleFirestoreError(err, OperationType.LIST, 'users'); } catch {}
          }
        );
        const uRequests = onSnapshot(
          query(collection(db, 'access_requests'), where('status', '==', 'pendiente')),
          (snap) => {
            const list = snap.docs
              .map((d) => mapAccessRequestDoc(d.id, d.data()))
              .filter((item) => item !== null && item.status === 'pendiente')
              .sort((a, b) => b.requestedAtIso.localeCompare(a.requestedAtIso));
            state.accessRequestsError = '';
            state.accessRequests = list;
            if (!snap.metadata.fromCache || list.length > 0) {
              state.accessRequestsLoading = false;
            }
            render();
          },
          (err) => {
            state.accessRequestsError = formatFirestoreQueryError(err, 'Error al consultar las solicitudes de acceso en Firestore.');
            state.accessRequestsLoading = false;
            render();
            try { handleFirestoreError(err, OperationType.LIST, 'access_requests'); } catch {}
          }
        );
        state.unsubs.push(uStaff, uRequests);
        fetchPendingAccessRequestsFromServer()
          .then((list) => {
            if (epoch !== accessSyncEpoch) return;
            state.accessRequests = list;
            state.accessRequestsError = '';
            state.accessRequestsLoading = false;
            render();
          })
          .catch((err) => {
            if (epoch !== accessSyncEpoch) return;
            state.accessRequestsError = err instanceof Error ? err.message : 'Error al consultar las solicitudes de acceso en Firestore.';
            state.accessRequestsLoading = false;
            render();
          });
      } else {
        accessSyncEpoch++;
        state.accessRequests = [];
        state.accessRequestsLoading = false;
        state.accessRequestsError = '';
      }
    }

    async function maybeMigrateLegacyLocal() {
      if (state.migrationAttempted || !state.patientsLoaded || !isAuthorized()) return;
      state.migrationAttempted = true;
      try {
        if (localStorage.getItem(MIGRATION_DONE_KEY) === '1') return;
        const raw = localStorage.getItem(LEGACY_LOCAL_KEY);
        if (!raw) { localStorage.setItem(MIGRATION_DONE_KEY, '1'); return; }
        const parsed = JSON.parse(raw);
        const list = Array.isArray(parsed?.patients) ? parsed.patients : [];
        if (list.length > 0) {
          const { imported } = await importBatchToCloud(list, 'migrate_local');
          if (imported > 0) showToast(`Se migraron ${imported} registros previos a la base compartida.`);
        }
        localStorage.setItem(MIGRATION_DONE_KEY, '1');
      } catch {
        // Conserva datos locales sin interrumpir
      }
    }

    onAuthStateChanged(auth, async (user) => {
      clearSubscriptions();
      state.user = user;
      state.authReady = true;
      state.authError = '';
      if (!user) {
        state.profile = null;
        state.patients = [];
        state.patientsLoaded = false;
        state.auditLogs = [];
        accessSyncEpoch++;
        state.staffUsers = [];
        state.staffUsersError = '';
        state.accessRequests = [];
        state.accessRequestsLoading = false;
        state.accessRequestsError = '';
        state.ownAccessRequest = null;
        state.requestFeedback = null;
        state.migrationAttempted = false;
        render();
        return;
      }

      state.profileLoading = true;
      render();
      try {
        state.profile = await ensureUserProfile(user);
        state.profileLoading = false;
        let unsubOwnReq = null;
        const syncOwnReqListener = () => {
          if (isAuthorized()) {
            if (unsubOwnReq) { try { unsubOwnReq(); } catch {} unsubOwnReq = null; }
            state.ownAccessRequest = null;
          } else if (!unsubOwnReq) {
            unsubOwnReq = onSnapshot(doc(db, 'access_requests', user.uid), (snap) => {
              state.ownAccessRequest = snap.exists() ? mapAccessRequestDoc(snap.id, snap.data()) : null;
              render();
            });
            state.unsubs.push(() => { if (unsubOwnReq) { try { unsubOwnReq(); } catch {} unsubOwnReq = null; } });
          }
        };
        const unsubOwn = onSnapshot(doc(db, 'users', user.uid), (snap) => {
          if (snap.exists()) {
            const d = snap.data();
            const wasAuth = isAuthorized();
            state.profile = {
              uid: user.uid,
              email: String(d.email || user.email || ''),
              displayName: String(d.displayName || ''),
              role: d.role === 'admin' ? 'admin' : 'staff',
              approved: Boolean(d.approved)
            };
            if (!wasAuth && isAuthorized()) {
              startDataSubscriptions();
            } else if (wasAuth && !isAuthorized()) {
              clearSubscriptions();
              state.patients = [];
              state.patientsLoaded = false;
              state.auditLogs = [];
              accessSyncEpoch++;
              state.staffUsers = [];
              state.staffUsersError = '';
              state.accessRequests = [];
              state.accessRequestsLoading = false;
              state.accessRequestsError = '';
              state.unsubs.push(unsubOwn);
            }
            syncOwnReqListener();
            render();
          }
        });
        state.unsubs.push(unsubOwn);
        if (isAuthorized()) startDataSubscriptions();
        syncOwnReqListener();
      } catch {
        state.profileLoading = false;
        state.authError = 'No se pudo inicializar tu perfil en Firestore. Intenta recargar.';
      }
      render();
    });

    function renderTime12hControl(prefix, value24) {
      const t = parse24To12(value24);

            ${hours.map((h) => `<option value="${h}" ${t.h === h ? 'selected' : ''}>${h || 'HH'}</option>`).join('')}
          </select>
          <span class="font-bold text-slate-500">:</span>
          <select data-time-part="${prefix}:m" aria-label="Minutos" class="min-h-[42px] rounded-lg border border-slate-300 bg-white px-2.5 text-sm font-mono-num text-slate-900 focus:border-teal-700 focus:outline-none">

            <option value="PM" ${t.p === 'PM' ? 'selected' : ''}>p. m.</option>

              <p class="text-base font-semibold text-slate-900">${state.patients.length === 0 ? 'Aún no hay pacientes registrados en esta guardia' : 'No hay pacientes en esta categoría o búsqueda'}</p>
              <p class="mt-1 text-sm text-slate-600">${state.patients.length === 0 ? 'Selecciona Formato de entrada para capturar el primer ingreso.' : 'Vuelve a la vista general para consultar todos los registros.'}</p>
              <div class="mt-4 flex justify-center gap-2">
                ${state.patients.length === 0
                  ? `<button type="button" data-action="go-entrada" class="min-h-[44px] rounded-xl bg-teal-700 px-5 py-2.5 text-sm font-bold text-white hover:bg-teal-800">Abrir Formato de entrada</button>`
                  : `<button type="button" data-action="reset-filters" class="min-h-[44px] rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-800 hover:bg-slate-50">Ver todos los pacientes</button>`}
              </div>
            </div>
          ` : `
            <div class="divide-y divide-slate-200">
              ${filtered.map((p) => {
                const outcome = getOutcome(p);
                const isHospitalized = outcome === 'hospitalizado';
                const exited = hasExit(p);
                const orderNum = orderById.get(p.id) || 1;
                const dateStr = formatIsoDateEs(p.fechaRegistro);
                const exitDateStr = formatIsoDateEs(p.fechaSalida);
                const dischargeTypeLabel = hospitalizationDischargeLabel(p.tipoAltaHospitalizacion);
                const entryStr = fmt12(p.horaEntrada);
                const exitStr = fmt12(p.horaSalida);
                const metaItems = [];
                if (dateStr) metaItems.push(`<span class="font-mono-num text-slate-800">Fecha: ${esc(dateStr)}</span>`);
                if (entryStr) metaItems.push(`<span class="font-mono-num text-slate-800">Entrada: ${esc(entryStr)}</span>`);
                if (exitStr) metaItems.push(`<span class="font-mono-num text-slate-800">Salida: ${esc(exitStr)}</span>`);
                if ((p.edad || '').trim()) metaItems.push(`<span>${esc(p.edad.trim())}</span>`);
                if ((p.procedencia || '').trim()) metaItems.push(`<span>${esc(p.procedencia.trim())}</span>`);

                const details = [];
                if (dischargeTypeLabel) details.push(`<div><dt class="inline font-semibold text-slate-900">Tipo de alta:</dt> <dd class="inline font-semibold text-indigo-900">${esc(dischargeTypeLabel)}</dd></div>`);
                if (exitDateStr) details.push(`<div><dt class="inline font-semibold text-slate-900">Fecha de salida:</dt> <dd class="inline font-mono-num font-semibold text-slate-900">${esc(exitDateStr)}</dd></div>`);
                if ((p.motivoVisita || '').trim()) details.push(`<div><dt class="inline font-semibold text-slate-900">Motivo de visita:</dt> <dd class="inline">${esc(p.motivoVisita.trim())}</dd></div>`);
                if ((p.destinoTraslado || '').trim()) details.push(`<div class="sm:col-span-2"><dt class="inline font-semibold text-slate-900">Destino del traslado:</dt> <dd class="inline font-semibold text-blue-900">${esc(p.destinoTraslado.trim())}</dd></div>`);
                if ((p.observaciones || '').trim()) details.push(`<div><dt class="inline font-semibold text-slate-900">${(p.observacionesSalida || '').trim() ? 'Obs. ingreso:' : 'Observaciones:'}</dt> <dd class="inline">${esc(p.observaciones.trim())}</dd></div>`);
                if ((p.medico || '').trim()) details.push(`<div><dt class="inline font-semibold text-slate-900">Médico que lo atendió:</dt> <dd class="inline">${esc(p.medico.trim())}</dd></div>`);
                if ((p.enfermera || '').trim()) details.push(`<div><dt class="inline font-semibold text-slate-900">Enfermera que lo atendió:</dt> <dd class="inline">${esc(p.enfermera.trim())}</dd></div>`);
                if ((p.diagnostico || '').trim()) details.push(`<div class="sm:col-span-2"><dt class="inline font-semibold text-slate-900">Diagnóstico:</dt> <dd class="inline">${esc(p.diagnostico.trim())}</dd></div>`);
                if ((p.observacionesSalida || '').trim()) details.push(`<div class="sm:col-span-2"><dt class="inline font-semibold text-slate-900">Obs. salida:</dt> <dd class="inline">${esc(p.observacionesSalida.trim())}</dd></div>`);

                return `
                  <article class="py-4 first:pt-4 last:pb-1">
                    <div class="flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
                      <div class="min-w-0 flex-1">
                        <div class="flex flex-wrap items-baseline gap-x-2.5 gap-y-1">
                          <span class="font-mono-num text-xs font-bold text-slate-500">#${orderNum}</span>
                          ${(p.nombre || '').trim()
                            ? `<h3 class="text-base font-bold text-slate-900"><span class="font-medium text-slate-600">${esc(treatmentLabel(p.tratamiento))}:</span> ${esc(p.nombre.trim())}</h3>`
                            : `<h3 class="text-base font-bold text-slate-900">Registro #${orderNum}</h3>`}
                          <span class="text-xs font-bold ${outcomeTextColor(outcome)}">${esc(outcomeLabel(outcome))}</span>
                        </div>

                        ${metaItems.length > 0 ? `
                          <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5 text-xs text-slate-600">
                            ${metaItems.join('<span aria-hidden="true">·</span>')}
                          </div>` : ''}

                        ${details.length > 0 ? `
                          <dl class="mt-2.5 grid grid-cols-1 gap-1.5 text-sm text-slate-700 sm:grid-cols-2">
                            ${details.join('')}
                          </dl>` : ''}
                      </div>

                      <div class="flex flex-wrap items-center gap-2 shrink-0">
                        <button type="button" data-action="open-discharge" data-id="${esc(p.id)}"
                          class="min-h-[40px] rounded-xl px-3.5 py-2 text-xs font-bold transition-colors whitespace-nowrap shrink-0 ${
                            exited && !isHospitalized
                              ? 'border border-teal-300 bg-teal-50 text-teal-900 hover:bg-teal-100'
                              : 'bg-teal-700 text-white hover:bg-teal-800'
                          }">
                          ${isHospitalized ? 'Registrar salida' : exited ? 'Editar salida' : 'Registrar salida'}
                        </button>
                        <button type="button" data-action="open-whatsapp" data-id="${esc(p.id)}" data-type="ingreso"
                          class="min-h-[40px] rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-800 hover:bg-slate-50 whitespace-nowrap shrink-0">
                          WA Entrada
                        </button>
                        ${exited ? `
                          <button type="button" data-action="open-whatsapp" data-id="${esc(p.id)}" data-type="salida"
                            class="min-h-[40px] rounded-xl border border-emerald-300 bg-emerald-50 px-3 py-2 text-xs font-semibold text-emerald-900 hover:bg-emerald-100 whitespace-nowrap shrink-0">
                            WA Salida
                          </button>` : ''}
                        <button type="button" data-action="open-hospitalization" data-id="${esc(p.id)}"
                          class="min-h-[40px] rounded-xl border px-3 py-2 text-xs font-semibold transition-colors whitespace-nowrap shrink-0 ${
                            outcome === 'hospitalizado'
                              ? 'border-indigo-700 bg-indigo-700 text-white hover:bg-indigo-800'
                              : 'border-indigo-300 bg-indigo-50 text-indigo-900 hover:bg-indigo-100'
                          }">
                          Hospitalización
                        </button>
                        <button type="button" data-action="open-transfer" data-id="${esc(p.id)}"
                          class="min-h-[40px] rounded-xl border px-3 py-2 text-xs font-semibold transition-colors whitespace-nowrap shrink-0 ${
                            outcome === 'trasladado'
                              ? 'border-blue-700 bg-blue-700 text-white hover:bg-blue-800'
                              : 'border-blue-300 bg-blue-50 text-blue-900 hover:bg-blue-100'
                          }">
                          Traslado
                        </button>
                        <button type="button" data-action="edit-patient" data-id="${esc(p.id)}"
                          class="min-h-[40px] rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 whitespace-nowrap shrink-0">
                          Editar
                        </button>
                        ${admin ? `
                          <button type="button" data-action="open-delete-single" data-id="${esc(p.id)}" class="min-h-[40px] rounded-xl border border-red-200 bg-white px-3 py-2 text-xs font-semibold text-red-700 hover:bg-red-50 whitespace-nowrap shrink-0">Eliminar</button>
                        ` : ''}
                      </div>
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
          `}
        </section>`;
    }

                </div>` : ''}

                  ${[

            <div class="grid grid-cols-1 gap-4 md:grid-cols-3">

                  ${renderMicButton('intake:nombre', 'nombre')}

                  ${renderMicButton('intake:edad', 'edad')}

                ${renderMicButton('intake:motivoVisita', 'motivo de visita')}
              </div>
              <textarea id="f-motivo" data-intake-field="motivoVisita" rows="2" maxlength="1000"

              <div class="mt-2 flex flex-wrap gap-1.5">

                      </div>
                      <p class="mt-1 text-[11px] text-slate-500">Se guardará como: <strong>${esc(formatNurse(hm.nurseName) || '—')}</strong></p>

                  <div>
                    <div class="flex items-center justify-between gap-2 mb-1.5">

                      class="w-full rounded-xl border border-slate-300 p-3 text-sm text-slate-900 focus:border-indigo-700 focus:outline-none">${esc(hm.observacionesSalida)}</textarea>

                  <div>
                    <button type="button" data-action="spellcheck-hospitalization" class="min-h-[40px] rounded-xl border border-indigo-300 bg-indigo-50 px-3.5 py-2 text-xs font-bold text-indigo-900 hover:bg-indigo-100">Rectificar escritura y ortografía</button>

                <div class="mt-5 flex flex-col-reverse gap-2 border-t border-slate-200 pt-4 sm:flex-row sm:justify-end">
                  <button type="button" data-action="close-hospitalization" class="min-h-[42px] rounded-xl border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-700">Cancelar</button>
                  <button type="button" data-action="save-hospitalization" data-open-wa="1" ${state.isSaving ? 'disabled' : ''} class="min-h-[42px] rounded-xl border border-emerald-700 bg-emerald-50 px-4 py-2 text-xs font-bold text-emerald-900 hover:bg-emerald-100">Guardar y abrir WhatsApp</button>
                  <button type="button" data-action="save-hospitalization" data-open-wa="0" ${state.isSaving ? 'disabled' : ''} class="min-h-[42px] rounded-xl bg-indigo-700 px-5 py-2 text-xs font-bold text-white hover:bg-indigo-800">Guardar hospitalización</button>
                </div>
              </div>
            </div>`;
        }
      }

      // Modal 1c: Traslado (Destino del traslado, Hora de salida, Médico, Observaciones)
      if (state.transferModal) {
        const tm = state.transferModal;
        const patient = state.patients.find((p) => p.id === tm.patientId);
        if (patient) {
          html += `
            <div class="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-slate-950/60 p-0 sm:p-5 overflow-y-auto">
              <div role="dialog" aria-modal="true" aria-label="Registrar traslado" class="w-full max-w-2xl rounded-t-2xl sm:rounded-2xl border border-slate-200 bg-white p-5 sm:p-6 max-h-[92vh] overflow-y-auto">
                <div class="flex items-start justify-between gap-4 border-b border-slate-200 pb-3">
                  <div>
                    <div class="text-[11px] font-bold uppercase tracking-wider text-blue-800">Traslado</div>
                    <h2 class="mt-0.5 text-lg font-bold text-slate-900">${getOutcome(patient) === 'trasladado' ? 'Editar datos de traslado' : 'Registrar traslado del paciente'}</h2>
                    <p class="text-xs text-slate-600">${[patient.nombre ? esc(patient.nombre) : '', fmt12(patient.horaEntrada) ? `Entrada: ${esc(fmt12(patient.horaEntrada))}` : ''].filter(Boolean).join(' · ')}</p>
                  </div>
                  <button type="button" data-action="close-transfer" class="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50">Cerrar</button>
                </div>

                ${tm.error ? `<div role="alert" class="mt-3 rounded-xl border border-red-200 bg-red-50 p-3 text-xs font-semibold text-red-800">${esc(tm.error)}</div>` : ''}

                <div class="mt-4 space-y-4">
                  <div>
                    <div class="flex items-center justify-between gap-2 mb-1.5">
                      <label for="t-destino" class="text-xs font-bold text-slate-800">Destino del traslado</label>
                      ${renderMicButton('transfer:destinoTraslado', 'destino del traslado')}
                    </div>
                    <input id="t-destino" data-transfer-field="destinoTraslado" type="text" maxlength="200" value="${esc(tm.destinoTraslado)}"
                      placeholder="Ej. Hospital General, Clínica, unidad receptora..."
                      class="w-full min-h-[44px] rounded-xl border border-slate-300 px-3.5 text-sm text-slate-900 focus:border-blue-700 focus:outline-none" />
                    <p class="mt-1 text-[11px] text-slate-500">Se mostrará en el formato del paciente y reportes únicamente si fue ingresado.</p>
                  </div>

                  <div>
                    <label class="block text-xs font-bold text-slate-800 mb-1.5">Hora de salida (formato 12 h)</label>
                    ${renderTime12hControl('transfer-salida', tm.horaSalida)}
                  </div>

                  <div>
                    <div class="flex items-center justify-between gap-2 mb-1.5">
                      <label for="t-medico" class="text-xs font-bold text-slate-800">Médico que lo atendió</label>
                      ${renderMicButton('transfer:doctorName', 'médico')}
                    </div>
                    <div class="flex gap-1.5">
                      <select data-transfer-field="doctorTitle" aria-label="Título médico" class="min-h-[42px] rounded-xl border border-slate-300 bg-slate-50 px-2.5 text-xs font-bold text-slate-900">
                        <option value="DR." ${tm.doctorTitle === 'DR.' ? 'selected' : ''}>DR.</option>
                        <option value="DRA." ${tm.doctorTitle === 'DRA.' ? 'selected' : ''}>DRA.</option>
                      </select>
                      <input id="t-medico" data-transfer-field="doctorName" type="text" value="${esc(tm.doctorName)}" placeholder="Nombre y apellidos (opcional)"
                        class="flex-1 min-h-[42px] rounded-xl border border-slate-300 px-3 text-sm text-slate-900 focus:border-blue-700 focus:outline-none" />
                    </div>
                    <p class="mt-1 text-[11px] text-slate-500">Se guardará como: <strong>${esc(formatDoctor(tm.doctorTitle, tm.doctorName) || '—')}</strong></p>
                  </div>

                  <div>
                    <div class="flex items-center justify-between gap-2 mb-1.5">
                      <label for="t-obs" class="text-xs font-bold text-slate-800">Observaciones</label>
                      ${renderMicButton('transfer:observacionesSalida', 'observaciones')}
                    </div>
                    <textarea id="t-obs" data-transfer-field="observacionesSalida" rows="2" maxlength="1500"
                      placeholder="Observaciones del traslado (opcional)..."
                      class="w-full rounded-xl border border-slate-300 p-3 text-sm text-slate-900 focus:border-blue-700 focus:outline-none">${esc(tm.observacionesSalida)}</textarea>
                  </div>

                  <div>
                    <button type="button" data-action="spellcheck-transfer" class="min-h-[40px] rounded-xl border border-blue-300 bg-blue-50 px-3.5 py-2 text-xs font-bold text-blue-900 hover:bg-blue-100">Rectificar escritura y ortografía</button>
                  </div>
                </div>

                <div class="mt-5 flex flex-col-reverse gap-2 border-t border-slate-200 pt-4 sm:flex-row sm:justify-end">
                  <button type="button" data-action="close-transfer" class="min-h-[42px] rounded-xl border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-700">Cancelar</button>
                  <button type="button" data-action="save-transfer" data-open-wa="1" ${state.isSaving ? 'disabled' : ''} class="min-h-[42px] rounded-xl border border-emerald-700 bg-emerald-50 px-4 py-2 text-xs font-bold text-emerald-900 hover:bg-emerald-100">Guardar y abrir WhatsApp</button>
                  <button type="button" data-action="save-transfer" data-open-wa="0" ${state.isSaving ? 'disabled' : ''} class="min-h-[42px] rounded-xl bg-blue-700 px-5 py-2 text-xs font-bold text-white hover:bg-blue-800">Guardar traslado</button>
                </div>
              </div>
            </div>`;
        }
      }

      // Modal 2: WhatsApp
      if (state.whatsappModal) {
        const p = state.patients.find((x) => x.id === state.whatsappModal.patientId);
        if (p) {
          const text = buildWhatsAppText(p, state.whatsappModal.type);
          const groupUrl = state.shiftConfig.whatsappGroupUrl || DEFAULT_WHATSAPP_GROUP_URL;
          html += `
            <div class="fixed inset-0 z-40 flex items-center justify-center bg-slate-950/60 p-3 sm:p-5">
              <div role="dialog" aria-modal="true" aria-label="Mensaje para WhatsApp" class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-5 sm:p-6">
                <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                  <h2 class="text-base font-bold text-slate-900">Mensaje de ${state.whatsappModal.type === 'salida' ? 'salida' : 'ingreso'} para WhatsApp</h2>
                  <button type="button" data-action="close-whatsapp" class="rounded-lg border border-slate-300 px-3 py-1 text-xs font-semibold text-slate-700">Cerrar</button>
                </div>
                <pre id="wa-preview-text" class="mt-4 max-h-72 overflow-y-auto whitespace-pre-wrap rounded-xl border border-slate-200 bg-slate-50 p-3.5 font-sans text-xs leading-relaxed text-slate-900">${esc(text)}</pre>
                <div class="mt-4 flex flex-wrap gap-2">
                  <button type="button" data-action="copy-wa-text" class="flex-1 min-h-[44px] rounded-xl bg-teal-700 px-4 py-2 text-xs font-bold text-white hover:bg-teal-800">Copiar mensaje</button>
                  <a href="${esc(groupUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex flex-1 min-h-[44px] items-center justify-center rounded-xl bg-emerald-700 px-4 py-2 text-xs font-bold text-white hover:bg-emerald-800">Abrir grupo WhatsApp</a>
                </div>
              </div>
            </div>`;
        }
      }

      // Modal 3: Informe PDF y grupo de WhatsApp
      if (state.reportModalOpen) {
        const c = computeCounts(state.patients);
        html += `
          <div class="fixed inset-0 z-40 flex items-center justify-center bg-slate-950/60 p-3 sm:p-5">
            <div role="dialog" aria-modal="true" aria-label="Informe del día" class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-5 sm:p-6">
              <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <div>
                  <h2 class="text-base font-bold text-slate-900">Informe del día y envío</h2>
                  <p class="mt-0.5 text-[11px] text-slate-500">Orden cronológico: del primer registro al último · Solo datos ingresados</p>
                </div>
                <button type="button" data-action="close-report" class="rounded-lg border border-slate-300 px-3 py-1 text-xs font-semibold text-slate-700">Cerrar</button>
              </div>
              <div class="mt-4 grid grid-cols-3 gap-2 text-center text-xs">
                <div class="rounded-xl border border-slate-200 bg-slate-50 p-2"><div class="text-slate-600">Total</div><div class="text-lg font-bold tabular-nums">${c.total}</div></div>
                <div class="rounded-xl border border-amber-200 bg-amber-50 p-2"><div class="text-amber-900">Activos</div><div class="text-lg font-bold tabular-nums text-amber-900">${c.enAtencion}</div></div>
                <div class="rounded-xl border border-emerald-200 bg-emerald-50 p-2"><div class="text-emerald-900">Atendidos</div><div class="text-lg font-bold tabular-nums text-emerald-800">${c.atendidos}</div></div>
                <div class="rounded-xl border border-orange-200 bg-orange-50 p-2"><div class="text-orange-900">No esperó</div><div class="text-lg font-bold tabular-nums text-orange-800">${c.noEsperoTurno}</div></div>
                <div class="rounded-xl border border-red-200 bg-red-50 p-2"><div class="text-red-900">No atendidos</div><div class="text-lg font-bold tabular-nums text-red-800">${c.noAtendidos}</div></div>
                <div class="rounded-xl border border-blue-200 bg-blue-50 p-2"><div class="text-blue-900">Trasladados</div><div class="text-lg font-bold tabular-nums text-blue-800">${c.trasladados}</div></div>
                <div class="rounded-xl border border-indigo-200 bg-indigo-50 p-2"><div class="text-indigo-900">Hospitalización</div><div class="text-lg font-bold tabular-nums text-indigo-800">${c.hospitalizados}</div></div>
              </div>
              <div class="mt-4">
                <label for="wa-group-url" class="block text-xs font-bold text-slate-800 mb-1">Enlace del grupo de WhatsApp</label>
                <div class="flex gap-2">
                  <input id="wa-group-url" type="url" value="${esc(state.shiftConfig.whatsappGroupUrl)}" class="flex-1 min-h-[42px] rounded-xl border border-slate-300 px-3 text-xs text-slate-900" />
                  <button type="button" data-action="save-wa-group" class="min-h-[42px] rounded-xl border border-slate-300 bg-slate-50 px-3 text-xs font-bold text-slate-800 hover:bg-slate-100">Guardar</button>
                </div>
              </div>
              <div class="mt-4 flex flex-col gap-2">
                <button type="button" data-action="download-pdf" class="min-h-[44px] rounded-xl bg-teal-700 px-4 py-2 text-xs font-bold text-white hover:bg-teal-800">Descargar informe PDF (A4)</button>
                <button type="button" data-action="copy-shift-summary" class="min-h-[44px] rounded-xl border border-slate-300 bg-white px-4 py-2 text-xs font-bold text-slate-800 hover:bg-slate-50">Copiar reporte del día para WhatsApp</button>
                <a href="${esc(state.shiftConfig.whatsappGroupUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex min-h-[44px] items-center justify-center rounded-xl bg-emerald-700 px-4 py-2 text-xs font-bold text-white hover:bg-emerald-800">Abrir grupo de WhatsApp</a>
              </div>
            </div>
          </div>`;
      }

      // Modal 4: Corrector ortográfico
      if (state.spellModal) {
        const changed = state.spellModal.proposals.filter((p) => p.changed);
        html += `
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 p-3 sm:p-5">
            <div role="dialog" aria-modal="true" aria-label="Revisión de escritura y ortografía" class="w-full max-w-xl rounded-2xl border border-slate-200 bg-white p-5 sm:p-6 max-h-[88vh] overflow-y-auto">
              <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <h2 class="text-base font-bold text-slate-900">Rectificación de escritura y ortografía</h2>
                <button type="button" data-action="close-spell" class="rounded-lg border border-slate-300 px-3 py-1 text-xs font-semibold text-slate-700">Cerrar</button>
              </div>
              ${changed.length === 0 ? `
                <p class="mt-4 text-sm text-emerald-800 font-medium">No se detectaron errores ortográficos ni de formato en los campos capturados.</p>
                <div class="mt-4 flex justify-end"><button type="button" data-action="close-spell" class="min-h-[40px] rounded-xl bg-teal-700 px-4 py-2 text-xs font-bold text-white">Entendido</button></div>
              ` : `
                <div class="mt-4 space-y-3">
                  ${changed.map((item) => `
                    <div class="rounded-xl border border-slate-200 bg-slate-50 p-3 text-xs">
                      <div class="font-bold text-slate-900">${esc(item.label)} · <span class="font-normal text-slate-600">${esc(item.reasons.join(', '))}</span></div>
                      <div class="mt-1 text-slate-500 line-through">${esc(item.original)}</div>
                      <div class="mt-1 font-semibold text-teal-900">${esc(item.proposed)}</div>
                    </div>
                  `).join('')}
                </div>
                <div class="mt-5 flex justify-end gap-2">
                  <button type="button" data-action="close-spell" class="min-h-[42px] rounded-xl border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-700">Cancelar</button>
                  <button type="button" data-action="apply-spell" class="min-h-[42px] rounded-xl bg-teal-700 px-5 py-2 text-xs font-bold text-white hover:bg-teal-800">Aplicar correcciones</button>
                </div>
              `}
            </div>
          </div>`;
      }

      // Modal 5: Eliminación protegida (Solo administrador + contraseña de autorización)
      if (state.clearModal) {
        const cm = state.clearModal;
        const admin = isAdmin();
        const isSingle = cm.mode === 'single';
        const target = isSingle ? state.patients.find((p) => p.id === cm.patientId) : null;
        const title = isSingle ? 'Eliminar registro de paciente' : 'Eliminar todos los registros del turno';
        html += `
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 p-3 sm:p-5">
            <div role="dialog" aria-modal="true" aria-label="${esc(title)}" class="w-full max-w-lg rounded-2xl border border-red-200 bg-white p-5 sm:p-6">
              <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <h2 class="text-base font-bold text-red-900">${esc(title)}</h2>
                <button type="button" data-action="close-clear" class="rounded-lg border border-slate-300 px-3 py-1 text-xs font-semibold text-slate-700">Cancelar</button>
              </div>
              ${!admin ? `
                <p class="mt-4 text-sm text-red-800 font-medium">Acceso restringido: solo cuentas administradoras autorizadas pueden eliminar registros de pacientes.</p>
                <div class="mt-4 flex justify-end"><button type="button" data-action="close-clear" class="min-h-[42px] rounded-xl bg-slate-900 px-4 py-2 text-xs font-bold text-white">Entendido</button></div>
              ` : isSingle && !target ? `
                <p class="mt-4 text-sm text-slate-700">Este registro ya no existe en la base de datos.</p>
                <div class="mt-4 flex justify-end"><button type="button" data-action="close-clear" class="min-h-[42px] rounded-xl bg-slate-900 px-4 py-2 text-xs font-bold text-white">Cerrar</button></div>
              ` : cm.step === 'password' ? `
                <form id="delete-passcode-form" class="mt-4 space-y-4">
                  <p class="text-sm text-slate-700">
                    ${isSingle
                      ? `Para eliminar el registro${target?.nombre ? ` de <strong>${esc(target.nombre)}</strong>` : ''}, ingresa la contraseña de autorización.`
                      : `Para eliminar el historial completo de <strong>${state.patients.length}</strong> registros, ingresa la contraseña de autorización.`}
                  </p>
                  <div>
                    <label for="delete-passcode" class="block text-xs font-bold text-slate-800 mb-1.5">Contraseña de autorización</label>
                    <input id="delete-passcode" type="password" inputmode="numeric" autocomplete="off" value="${esc(cm.passcode)}" placeholder="Ingresa la contraseña"
                      class="w-full min-h-[44px] rounded-xl border border-slate-300 px-3.5 text-sm font-mono-num text-slate-900 focus:border-red-600 focus:outline-none" />
                  </div>
                  ${cm.error ? `<div role="alert" class="rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-xs font-semibold text-red-800">${esc(cm.error)}</div>` : ''}
                  <div class="flex justify-end gap-2 pt-1">
                    <button type="button" data-action="close-clear" class="min-h-[42px] rounded-xl border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-700">Cancelar</button>
                    <button type="submit" ${cm.busy ? 'disabled' : ''} class="min-h-[42px] rounded-xl bg-red-600 px-5 py-2 text-xs font-bold text-white hover:bg-red-700 disabled:opacity-50">
                      ${cm.busy ? 'Verificando...' : 'Validar contraseña'}
                    </button>
                  </div>
                </form>
              ` : `
                <div class="mt-4 space-y-4">
                  <div class="rounded-xl border border-emerald-200 bg-emerald-50 px-3.5 py-2.5 text-xs font-semibold text-emerald-900">
                    Contraseña verificada por ${esc(state.user.email)}. Confirma la eliminación definitiva.
                  </div>
                  <p class="text-sm text-slate-700">
                    ${isSingle
                      ? `Se eliminará permanentemente el registro${target?.nombre ? ` de <strong>${esc(target.nombre)}</strong>` : ''} para todos los dispositivos conectados. Esta acción no se puede deshacer.`
                      : `Se eliminarán permanentemente los <strong>${state.patients.length}</strong> registros actuales para todos los dispositivos conectados. Esta acción no se puede deshacer.`}
                  </p>
                  ${!isSingle ? `
                    <div class="flex flex-wrap gap-2">
                      <button type="button" data-action="download-pdf" class="min-h-[38px] rounded-lg border border-slate-300 bg-slate-50 px-3 text-xs font-semibold text-slate-800 hover:bg-slate-100">Descargar PDF antes</button>
                      <button type="button" data-action="export-json" class="min-h-[38px] rounded-lg border border-slate-300 bg-slate-50 px-3 text-xs font-semibold text-slate-800 hover:bg-slate-100">Exportar respaldo JSON</button>
                    </div>` : ''}
                  ${cm.error ? `<div role="alert" class="rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-xs font-semibold text-red-800">${esc(cm.error)}</div>` : ''}
                  <div class="flex justify-end gap-2 pt-1">
                    <button type="button" data-action="close-clear" class="min-h-[42px] rounded-xl border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-700">Cancelar</button>
                    <button type="button" data-action="execute-protected-delete" ${cm.busy ? 'disabled' : ''}
                      class="min-h-[42px] rounded-xl bg-red-600 px-5 py-2 text-xs font-bold text-white hover:bg-red-700 disabled:opacity-50">
                      ${cm.busy ? 'Eliminando...' : (isSingle ? 'Confirmar eliminación' : 'Confirmar eliminación total')}
                    </button>
                  </div>
                </div>
              `}
            </div>
          </div>`;
      }

      return html;
    }

    function render() {
      const root = document.getElementById('root');
      if (!root) return;

      if (!state.authReady || !state.user || (state.profileLoading && !isBootAdmin(state.user)) || !isAuthorized()) {
        root.innerHTML = renderAuthScreen();
        return;
      }

      const c = computeCounts(state.patients);
      const admin = isAdmin();

      root.innerHTML = `
        <div class="min-h-screen flex flex-col pb-20 md:pb-0">
          <!-- Barra superior de 3 zonas -->
          <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur-sm">
            <div class="mx-auto flex max-w-[1360px] items-center justify-between gap-8 px-4 py-3 sm:px-6 lg:px-8">
              <button type="button" data-action="nav" data-view="pacientes" class="font-display text-lg font-extrabold tracking-tight text-teal-800 whitespace-nowrap shrink-0">

                <span class="font-medium">${esc(state.conflictNotice)}</span>
                <button type="button" data-action="dismiss-conflict" class="rounded-lg border border-amber-400 bg-white px-3 py-1.5 text-xs font-bold text-amber-950">Entendido</button>
              </div>` : ''}

            ${state.runtimeError ? `
              <div role="alert" class="mt-4 rounded-xl border border-red-300 bg-red-50 p-4 text-sm font-medium text-red-900">${esc(state.runtimeError)}</div>` : ''}

            <div class="mt-6">
              ${state.activeView === 'entrada' ? renderIntakeView() : state.activeView === 'seguridad' ? renderSecurityView() : renderPatientsView()}

            <div class="mx-auto flex max-w-[1360px] flex-col gap-1 px-4 py-4 text-xs text-slate-500 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">

              <button type="button" data-action="nav" data-view="entrada" class="min-h-[48px] rounded-lg text-[11px] font-bold ${state.activeView === 'entrada' ? 'bg-teal-50 text-teal-800' : 'text-slate-600'}">Entrada</button>

          ${renderModals()}
